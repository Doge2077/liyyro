<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一次工具调用的四步与三方分工</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tcf-title tcf-desc">
    <title id="tcf-title">一次工具调用的四步与三方分工</title>
    <desc id="tcf-desc">第一步宿主把工具声明放进请求；第二步模型生成工具名与参数；第三步运行时校验权限后执行；第四步结果回填上下文，模型继续。每一步的失败方式不同。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="cf-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="cf-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="36" y="30" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">ONE CALL, FOUR STEPS</text>

    <g>
      <rect x="36" y="52" width="214" height="78" fill="#ececec" stroke="#7a8399"/>
      <text x="54" y="74" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STEP 1</text>
      <text x="54" y="96" fill="#2d3142" font-size="12" font-weight="600">声明进请求</text>
      <text x="54" y="116" fill="#4f5d75" font-size="9">名称、说明、参数结构</text>
    </g>
    <path d="M 250 91 H 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cf-ar)"/>

    <g>
      <rect x="272" y="52" width="214" height="78" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="290" y="74" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STEP 2</text>
      <text x="290" y="96" fill="#2d3142" font-size="12" font-weight="600">模型选工具填参数</text>
      <text x="290" y="116" fill="#4f5d75" font-size="9">返回工具名与一组键值</text>
    </g>
    <path d="M 486 91 H 508" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cf-ar)"/>

    <g>
      <rect x="508" y="52" width="214" height="78" fill="#fff" stroke="#2d3142"/>
      <text x="526" y="74" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STEP 3</text>
      <text x="526" y="96" fill="#2d3142" font-size="12" font-weight="600">运行时校验后执行</text>
      <text x="526" y="116" fill="#4f5d75" font-size="9">结构、权限、副作用</text>
    </g>
    <path d="M 722 91 H 744" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cf-ar)"/>

    <g>
      <rect x="744" y="52" width="220" height="78" fill="#fff" stroke="#2d3142"/>
      <text x="762" y="74" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STEP 4</text>
      <text x="762" y="96" fill="#2d3142" font-size="12" font-weight="600">结果回填</text>
      <text x="762" y="116" fill="#4f5d75" font-size="9">模型据此决定下一步</text>
    </g>

    <g>
      <rect x="36" y="152" width="928" height="52" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="172" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">WHO ACTS</text>
      <text x="54" y="192" fill="#4f5d75" font-size="10">宿主组装请求　·　模型做选择　·　运行时持执行权　·　环境返回真实状态　·　宿主再把它放回上下文</text>
    </g>

    <text x="36" y="230" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">WHERE EACH STEP BREAKS</text>

    <g>
      <rect x="36" y="242" width="222" height="86" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="264" fill="#2d3142" font-size="11" font-weight="600">选错</text>
      <text x="54" y="284" fill="#4f5d75" font-size="9">声明里没说清什么时候用，</text>
      <text x="54" y="300" fill="#4f5d75" font-size="9">或与别的工具区分不开。</text>
    </g>
    <g>
      <rect x="272" y="242" width="222" height="86" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="290" y="264" fill="#2d3142" font-size="11" font-weight="600">填错</text>
      <text x="290" y="284" fill="#4f5d75" font-size="9">结构不合法，或语义填偏：</text>
      <text x="290" y="300" fill="#4f5d75" font-size="9">查询词太宽、路径指错文件。</text>
    </g>
    <g>
      <rect x="508" y="242" width="222" height="86" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="526" y="264" fill="#2d3142" font-size="11" font-weight="600">被静默改掉</text>
      <text x="526" y="284" fill="#4f5d75" font-size="9">工具悄悄修正了参数，</text>
      <text x="526" y="300" fill="#4f5d75" font-size="9">模型看到的世界与执行的世界不一致。</text>
    </g>
    <g>
      <rect x="744" y="242" width="220" height="86" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="762" y="264" fill="#2d3142" font-size="11" font-weight="600">读错</text>
      <text x="762" y="284" fill="#4f5d75" font-size="9">返回是一段长文本，</text>
      <text x="762" y="300" fill="#4f5d75" font-size="9">或截断了但没说。</text>
    </g>

    <text x="36" y="360" fill="#7a8399" font-size="10">四步里只有第三步与第四步是工具自己的责任；前两步的问题出在声明与描述上，改执行代码解决不了。</text>
    <text x="36" y="382" fill="#7a8399" font-size="10">模型看不到函数体，它看到的是第一步那份声明。设计的对象就是这份声明与第四步那份返回。</text>
  </svg>
</body>
</html>
