<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四种注入方式与常驻成本</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mem-inj-title mem-inj-desc">
    <title id="mem-inj-title">四种注入方式与常驻成本</title>
    <desc id="mem-inj-desc">常驻索引与指令链每轮都付固定成本，按需挑选只在命中时付细节成本，引用快照按被引用会话的体积一次性计入。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="mi-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="96" y="42" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">COST PER TURN</text>

    <path d="M 96 348 V 76" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mi-arrow)"/>
    <text x="70" y="212" text-anchor="middle" fill="#4f5d75" font-size="11">每轮</text>
    <text x="70" y="230" text-anchor="middle" fill="#4f5d75" font-size="11">成本</text>

    <line x1="96" y1="348" x2="948" y2="348" stroke="#4f5d75" stroke-width="1.2"/>
    <line x1="96" y1="300" x2="948" y2="300" stroke="rgba(45,49,66,.10)"/>
    <line x1="96" y1="228" x2="948" y2="228" stroke="rgba(45,49,66,.10)"/>
    <line x1="96" y1="156" x2="948" y2="156" stroke="rgba(45,49,66,.10)"/>
    <line x1="96" y1="84" x2="948" y2="84" stroke="rgba(45,49,66,.10)"/>
    <text x="90" y="352" text-anchor="end" fill="#7a8399" font-size="9" font-family="var(--mono)">0</text>
    <text x="90" y="232" text-anchor="end" fill="#7a8399" font-size="9" font-family="var(--mono)">10 KB</text>
    <text x="90" y="160" text-anchor="end" fill="#7a8399" font-size="9" font-family="var(--mono)">25 KB</text>
    <text x="90" y="88" text-anchor="end" fill="#7a8399" font-size="9" font-family="var(--mono)">65 KB</text>

    <g>
      <rect x="140" y="84" width="150" height="264" fill="rgba(45,49,66,.10)" stroke="#7a8399"/>
      <text x="215" y="120" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">指令链整段</text>
      <text x="215" y="146" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">65,536 B 预算</text>
      <text x="215" y="330" text-anchor="middle" fill="#7a8399" font-size="9" font-family="var(--mono)">DSH</text>
    </g>

    <g>
      <rect x="340" y="134" width="150" height="214" fill="rgba(45,49,66,.06)" stroke="#7a8399"/>
      <text x="415" y="170" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">索引常驻</text>
      <text x="415" y="196" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">200 行 / 25 KB</text>
      <text x="415" y="330" text-anchor="middle" fill="#7a8399" font-size="9" font-family="var(--mono)">Claude Code</text>
    </g>

    <g>
      <rect x="540" y="270" width="150" height="78" fill="rgba(46,90,168,.10)" stroke="#2e5aa8"/>
      <text x="615" y="300" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">摘要常驻</text>
      <text x="615" y="324" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">≤ 10 KB</text>
      <text x="615" y="342" text-anchor="middle" fill="#7a8399" font-size="9" font-family="var(--mono)">Codex</text>
    </g>

    <g>
      <rect x="740" y="140" width="150" height="208" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="815" y="176" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">按需挑选</text>
      <text x="815" y="202" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">≤ 5 份选中</text>
      <text x="815" y="222" text-anchor="middle" fill="#7a8399" font-size="9">成本随命中浮动</text>
      <text x="815" y="330" text-anchor="middle" fill="#7a8399" font-size="9" font-family="var(--mono)">Claude Code 按需模式</text>
    </g>

    <line x1="96" y1="366" x2="948" y2="366" stroke="rgba(45,49,66,.12)"/>
    <text x="96" y="388" fill="#4f5d75" font-size="11">常驻部分决定下限，按需部分决定上限。索引与摘要的选择标准是“是否每轮都需要”。</text>
  </svg>
</body>
</html>
