<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>从观测到发布的完整链路</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ep-title ep-desc">
    <title id="ep-title">从观测到发布的完整链路</title>
    <desc id="ep-desc">线上观测产出轨迹，离线回归判定是否退化，发布检查按四类门槛放行，灰度验证后全量或回滚，线上失败回流为新用例。</desc>
    <rect width="1000" height="380" fill="#f5f5f5"/>
    <defs>
      <marker id="ep-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ep-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">CLOSED LOOP</text>

    <path d="M 210 84 H 250" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ep-ar)"/>
    <path d="M 420 84 H 460" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ep-ar)"/>
    <path d="M 630 84 H 670" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ep-ac)"/>
    <path d="M 840 84 H 880" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ep-ar)"/>

    <g>
      <rect x="40" y="52" width="170" height="64" fill="#ececec" stroke="#7a8399"/>
      <text x="125" y="78" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">线上观测</text>
      <text x="125" y="98" text-anchor="middle" fill="#4f5d75" font-size="9">轨迹与失败样本</text>
    </g>
    <g>
      <rect x="250" y="52" width="170" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="335" y="78" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">离线回归</text>
      <text x="335" y="98" text-anchor="middle" fill="#4f5d75" font-size="9">按变更类型选子集</text>
    </g>
    <g>
      <rect x="460" y="52" width="170" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="545" y="78" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">发布检查</text>
      <text x="545" y="98" text-anchor="middle" fill="#4f5d75" font-size="9">四类门</text>
    </g>
    <g>
      <rect x="670" y="44" width="170" height="80" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="755" y="72" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">灰度</text>
      <text x="755" y="92" text-anchor="middle" fill="#4f5d75" font-size="9">按流量或任务族</text>
      <text x="755" y="110" text-anchor="middle" fill="#7a8399" font-size="9">观察退化信号</text>
    </g>
    <g>
      <rect x="880" y="52" width="80" height="64" fill="#eaf0fa" stroke="#2e5aa8"/>
      <text x="920" y="78" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">全量</text>
      <text x="920" y="98" text-anchor="middle" fill="#4f5d75" font-size="9">或回滚</text>
    </g>

    <path d="M 920 116 V 156 H 545 V 188" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ep-ac)"/>
    <text x="600" y="150" fill="#7a8399" font-size="9">回滚</text>

    <g>
      <rect x="40" y="188" width="920" height="160" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="58" y="212" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">THE FOUR GATES</text>
      <text x="58" y="240" fill="#2d3142" font-size="12" font-weight="600">正确性 · 安全性 · 成本 · 时延</text>
      <text x="58" y="266" fill="#4f5d75" font-size="10">正确性：回归集通过率不低于基线，关键任务必须全过。</text>
      <text x="58" y="286" fill="#4f5d75" font-size="10">安全性：越权、注入、隐私三项有专门的用例集，任一失败即阻塞。</text>
      <text x="58" y="306" fill="#4f5d75" font-size="10">成本：单任务平均 Token 不超过基线的 1.2 倍，超过需说明理由。</text>
      <text x="58" y="326" fill="#4f5d75" font-size="10">时延：首词与总时长分别设上限，超限的改动只允许在非交互路径上线。</text>
    </g>

    <text x="40" y="372" fill="#7a8399" font-size="10">线上失败不是终点：每一条都要回流成新用例，否则同一类问题会反复出现。</text>
  </svg>
</body>
</html>
