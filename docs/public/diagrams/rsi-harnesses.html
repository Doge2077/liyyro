<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四家的自进化机制对照</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rh2-title rh2-desc">
    <title id="rh2-title">四家的自进化机制对照</title>
    <desc id="rh2-desc">Claude Code 有完整的观察到晋升管线与夜间整理，Codex 有两阶段记忆管线，OpenCode 的进化发生在构建期，DeepSeek Harness 靠插件装配。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="rh2-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="36" y="32" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">SIGNAL → CARRIER → GATE → ROLLBACK</text>

    <g>
      <rect x="36" y="52" width="928" height="30" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="73" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">WHAT IS LEARNED / WHERE IT LANDS / WHO APPROVES / HOW TO UNDO</text>
    </g>

    <g>
      <rect x="36" y="92" width="225" height="196" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="54" y="116" fill="#2d3142" font-size="12" font-weight="600">Claude Code</text>
      <text x="54" y="142" fill="#4f5d75" font-size="10">信号：会话观察事件</text>
      <text x="54" y="162" fill="#4f5d75" font-size="10">载体：直觉 → Skill / Agent / 命令</text>
      <text x="54" y="182" fill="#4f5d75" font-size="10">晋升：跨项目数与置信度</text>
      <text x="54" y="202" fill="#4f5d75" font-size="10">门槛：平均置信度 0.75</text>
      <text x="54" y="222" fill="#4f5d75" font-size="10">批准：生成后进入生命周期</text>
      <text x="54" y="242" fill="#4f5d75" font-size="10">回退：状态可置为陈旧或退役</text>
      <text x="54" y="268" fill="#7a8399" font-size="9">另有夜间整理与记忆抽取子代理</text>
    </g>

    <g>
      <rect x="281" y="92" width="225" height="196" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="299" y="116" fill="#2d3142" font-size="12" font-weight="600">Codex</text>
      <text x="299" y="142" fill="#4f5d75" font-size="10">信号：轨迹 + 使用统计</text>
      <text x="299" y="162" fill="#4f5d75" font-size="10">载体：手册 + 摘要 + 技能</text>
      <text x="299" y="182" fill="#4f5d75" font-size="10">流程：逐条抽取 → 全局整合</text>
      <text x="299" y="202" fill="#4f5d75" font-size="10">批准：整合前看工作区差异</text>
      <text x="299" y="222" fill="#4f5d75" font-size="10">回退：git 基线重置</text>
      <text x="299" y="248" fill="#7a8399" font-size="9">差异驱动删除传导；30 天未用不入选</text>
    </g>

    <g>
      <rect x="526" y="92" width="225" height="196" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="544" y="116" fill="#2d3142" font-size="12" font-weight="600">OpenCode</text>
      <text x="544" y="142" fill="#4f5d75" font-size="10">信号：无运行时观察</text>
      <text x="544" y="162" fill="#4f5d75" font-size="10">载体：插件与指令文件</text>
      <text x="544" y="182" fill="#4f5d75" font-size="10">时机：构建期，非运行期</text>
      <text x="544" y="202" fill="#4f5d75" font-size="10">批准：代码评审</text>
      <text x="544" y="222" fill="#4f5d75" font-size="10">回退：版本控制</text>
      <text x="544" y="248" fill="#7a8399" font-size="9">自修改发生在编译步骤，不在会话中</text>
    </g>

    <g>
      <rect x="771" y="92" width="193" height="196" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="789" y="116" fill="#2d3142" font-size="12" font-weight="600">DeepSeek Harness</text>
      <text x="789" y="142" fill="#4f5d75" font-size="10">信号：无内置学习</text>
      <text x="789" y="162" fill="#4f5d75" font-size="10">载体：插件、扩展、钩子</text>
      <text x="789" y="182" fill="#4f5d75" font-size="10">时机：装配期</text>
      <text x="789" y="202" fill="#4f5d75" font-size="10">批准：插件评审</text>
      <text x="789" y="222" fill="#4f5d75" font-size="10">回退：换配置</text>
      <text x="789" y="248" fill="#7a8399" font-size="9">能力全部外置，组合即进化</text>
    </g>

    <g>
      <rect x="36" y="308" width="928" height="76" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="332" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">THE AXIS THAT SPLITS THEM</text>
      <text x="54" y="356" fill="#2d3142" font-size="12" font-weight="600">前两家在运行期学习，后两家在打包期学习</text>
      <text x="54" y="376" fill="#4f5d75" font-size="10">运行期学习反馈快但需要管线；打包期学习反馈慢但完全可测。</text>
    </g>
  </svg>
</body>
</html>
