<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Harness 的压缩事务</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compact-deepseek-title compact-deepseek-desc">
    <title id="compact-deepseek-title">DeepSeek Harness 的压缩事务</title>
    <desc id="compact-deepseek-desc">压缩服务在事件日志中开启事务，修剪旧结果后请求摘要，校验摘要体积，写入替换事件并更新当前视图。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="ds-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ds-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#2e5aa8"/>
      </marker>
      <marker id="ds-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <line x1="160" y1="66" x2="160" y2="392" stroke="rgba(45,49,66,.22)" stroke-dasharray="4,4"/>
    <line x1="420" y1="66" x2="420" y2="392" stroke="rgba(45,49,66,.22)" stroke-dasharray="4,4"/>
    <line x1="680" y1="66" x2="680" y2="392" stroke="rgba(45,49,66,.22)" stroke-dasharray="4,4"/>
    <line x1="880" y1="66" x2="880" y2="392" stroke="rgba(45,49,66,.22)" stroke-dasharray="4,4"/>

    <path d="M 420 104 H 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ds-arrow)"/>
    <path d="M 420 140 H 456 V 158 H 428" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ds-arrow)"/>
    <path d="M 420 180 H 680" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#ds-link)"/>
    <path d="M 680 220 H 420" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ds-link)"/>
    <path d="M 420 256 H 456 V 274 H 428" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ds-arrow)"/>
    <path d="M 420 296 H 160" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ds-accent)"/>
    <path d="M 420 332 H 880" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ds-accent)"/>
    <path d="M 420 368 H 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ds-arrow)"/>

    <g>
      <rect x="90" y="30" width="140" height="36" rx="6" fill="#ececec" stroke="#7a8399"/>
      <text x="160" y="53" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">事件日志</text>
    </g>
    <g>
      <rect x="350" y="30" width="140" height="36" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="420" y="53" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">压缩服务</text>
    </g>
    <g>
      <rect x="610" y="30" width="140" height="36" rx="6" fill="rgba(46,90,168,.05)" stroke="#2e5aa8"/>
      <text x="680" y="53" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">摘要模型</text>
    </g>
    <g>
      <rect x="810" y="30" width="140" height="36" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="880" y="53" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">当前视图</text>
    </g>

    <rect x="248" y="86" width="84" height="12" fill="#f5f5f5"/>
    <text x="290" y="95" text-anchor="middle" fill="#4f5d75" font-size="9">开始压缩事务</text>
    <text x="464" y="144" fill="#4f5d75" font-size="9">修剪旧结果</text>
    <rect x="504" y="162" width="92" height="12" fill="#f5f5f5"/>
    <text x="550" y="171" text-anchor="middle" fill="#4f5d75" font-size="9">发送范围与摘要指令</text>
    <rect x="508" y="202" width="84" height="12" fill="#f5f5f5"/>
    <text x="550" y="211" text-anchor="middle" fill="#4f5d75" font-size="9">返回检查点摘要</text>
    <text x="464" y="260" fill="#4f5d75" font-size="9">校验摘要更小</text>
    <rect x="244" y="278" width="92" height="12" fill="#f5f5f5"/>
    <text x="290" y="287" text-anchor="middle" fill="#4f5d75" font-size="9">写入摘要与替换事件</text>
    <rect x="600" y="314" width="100" height="12" fill="#f5f5f5"/>
    <text x="650" y="323" text-anchor="middle" fill="#4f5d75" font-size="9">替换旧范围为检查点</text>
    <rect x="256" y="350" width="68" height="12" fill="#f5f5f5"/>
    <text x="290" y="359" text-anchor="middle" fill="#4f5d75" font-size="9">结束事务</text>
  </svg>
</body>
</html>
