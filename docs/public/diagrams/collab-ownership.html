<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上下文、状态与权限的三维归属</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cow-title cow-desc">
    <title id="cow-title">上下文、状态与权限的三维归属</title>
    <desc id="cow-desc">三个维度各自独立归属：上下文归执行者，状态归任务，权限归来源。三者混为一谈时，会话一换就丢状态。</desc>
    <rect width="1000" height="340" fill="#f5f5f5"/>
    <defs>
      <marker id="ow-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">THREE AXES, THREE OWNERS</text>

    <g>
      <rect x="40" y="56" width="290" height="104" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="58" y="80" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">CONTEXT</text>
      <text x="58" y="104" fill="#2d3142" font-size="14" font-weight="600">上下文归执行者</text>
      <text x="58" y="126" fill="#4f5d75" font-size="10">会话历史、工具结果、当前观察</text>
      <text x="58" y="146" fill="#7a8399" font-size="9">执行者换人，上下文就断</text>
    </g>
    <g>
      <rect x="355" y="56" width="290" height="104" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="373" y="80" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STATE</text>
      <text x="373" y="104" fill="#2d3142" font-size="14" font-weight="600">状态归任务</text>
      <text x="373" y="126" fill="#4f5d75" font-size="10">阶段、已完成项、待办、授权范围</text>
      <text x="373" y="146" fill="#7a8399" font-size="9">能跨执行者交接，才叫状态</text>
    </g>
    <g>
      <rect x="670" y="56" width="290" height="104" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="688" y="80" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">AUTHORITY</text>
      <text x="688" y="104" fill="#2d3142" font-size="14" font-weight="600">权限归来源</text>
      <text x="688" y="126" fill="#4f5d75" font-size="10">谁在哪个渠道、以什么身份发起</text>
      <text x="688" y="146" fill="#7a8399" font-size="9">权限不随上下文传播</text>
    </g>

    <path d="M 185 160 V 196" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ow-ar)"/>
    <path d="M 500 160 V 196" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ow-ar)"/>
    <path d="M 815 160 V 196" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ow-ar)"/>

    <g>
      <rect x="40" y="196" width="920" height="76" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="58" y="220" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">THE COMMON MISTAKE</text>
      <text x="58" y="244" fill="#2d3142" font-size="12" font-weight="600">把状态塞进上下文，等于让它随会话消失</text>
      <text x="58" y="262" fill="#4f5d75" font-size="10">反过来，把上下文当成权限，等于让「某人说过」变成「某人被授权」。</text>
    </g>

    <text x="40" y="306" fill="#7a8399" font-size="10">三个维度独立归属之后，执行者可以随时替换，而任务状态与授权范围不受影响。</text>
    <text x="40" y="328" fill="#7a8399" font-size="10">多 Agent 的收益主要来自这条分离，不来自「多个模型投票」。</text>
  </svg>
</body>
</html>
