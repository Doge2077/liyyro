<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记忆生命周期的六个环节</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mem-life-title mem-life-desc">
    <title id="mem-life-title">记忆生命周期的六个环节</title>
    <desc id="mem-life-desc">一次任务留下轨迹，抽取候选后由判据筛选，写入长期存储；新任务取回并在使用后回流到整理环节，整理负责合并、降权与删除。</desc>
    <rect width="1000" height="420" fill="#f5f5f5"/>
    <defs>
      <marker id="ml-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ml-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="40" y="42" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">SIX STAGES · ONE LOOP</text>

    <!-- top row: 轨迹 → 候选 → 判据 → 写入 -->
    <path d="M 210 118 H 250" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ml-arrow)"/>
    <path d="M 430 118 H 470" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ml-arrow)"/>
    <path d="M 650 118 H 690" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ml-accent)"/>

    <g>
      <rect x="40" y="86" width="170" height="64" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="56" y="106" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STAGE 1</text>
      <text x="56" y="126" fill="#2d3142" font-size="15" font-weight="600">任务轨迹</text>
      <text x="56" y="142" fill="#4f5d75" font-size="10">只追加，不改写</text>
    </g>
    <g>
      <rect x="250" y="86" width="180" height="64" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="266" y="106" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STAGE 2</text>
      <text x="266" y="126" fill="#2d3142" font-size="15" font-weight="600">候选提取</text>
      <text x="266" y="142" fill="#4f5d75" font-size="10">偏好 · 事实 · 失败</text>
    </g>
    <g>
      <rect x="470" y="86" width="180" height="64" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="486" y="106" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STAGE 3</text>
      <text x="486" y="126" fill="#2d3142" font-size="15" font-weight="600">写入判据</text>
      <text x="486" y="142" fill="#4f5d75" font-size="10">稳定 · 来源 · 授权</text>
    </g>
    <g>
      <rect x="690" y="86" width="270" height="64" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="706" y="106" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STAGE 4</text>
      <text x="706" y="126" fill="#2d3142" font-size="15" font-weight="600">长期存储</text>
      <text x="706" y="142" fill="#4f5d75" font-size="10">索引 · 主题文件 · 作用域</text>
    </g>

    <!-- 写入 → 取回 (down) -->
    <path d="M 825 150 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ml-arrow)"/>
    <text x="837" y="196" fill="#4f5d75" font-size="10" font-family="var(--mono)">next task</text>

    <!-- middle row right→left: 取回 → 使用 -->
    <path d="M 690 264 H 650" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ml-arrow)"/>
    <path d="M 470 264 H 430" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ml-arrow)"/>

    <g>
      <rect x="690" y="232" width="270" height="64" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="706" y="252" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STAGE 5</text>
      <text x="706" y="272" fill="#2d3142" font-size="15" font-weight="600">取回注入</text>
      <text x="706" y="288" fill="#4f5d75" font-size="10">索引常驻 · 细节按需</text>
    </g>
    <g>
      <rect x="250" y="232" width="180" height="64" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="266" y="252" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STAGE 6</text>
      <text x="266" y="272" fill="#2d3142" font-size="15" font-weight="600">使用与核对</text>
      <text x="266" y="288" fill="#4f5d75" font-size="10">与当前状态比对</text>
    </g>

    <!-- 使用 → 整理 -->
    <path d="M 340 296 V 338" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ml-accent)"/>

    <g>
      <rect x="40" y="340" width="600" height="56" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="56" y="361" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">MAINTENANCE</text>
      <text x="56" y="381" fill="#2d3142" font-size="14" font-weight="600">整理：合并重复 · 按使用降权 · 用户撤回 · 过期下线</text>
    </g>

    <!-- 整理 → 存储 (反馈) -->
    <path d="M 660 368 H 700 Q 708 368 708 360 V 300 Q 708 292 716 292 H 724" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ml-arrow)"/>
    <text x="600" y="326" fill="#7a8399" font-size="9" font-family="var(--mono)">stale → demote</text>

    <text x="40" y="412" fill="#7a8399" font-size="10">判据与整理是两处必须留下来源的环节：前者决定写不写，后者决定留不留，两者都以可回溯为前提。</text>
  </svg>
</body>
</html>
