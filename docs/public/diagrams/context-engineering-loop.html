<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上下文组装循环</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-loop-title context-loop-desc">
    <title id="context-loop-title">上下文组装循环</title>
    <desc id="context-loop-desc">任务输入经上下文组装进入模型，工具访问外部环境，结果更新任务状态后进入下一轮组装。</desc>
    <rect width="1000" height="240" fill="#f5f5f5"/>
    <defs>
      <marker id="context-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="context-loop-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      <marker id="context-loop-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>

    <path d="M 200 72 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-loop-arrow)"/>
    <path d="M 440 72 H 520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-loop-arrow)"/>
    <path d="M 680 72 H 760" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#context-loop-accent)"/>
    <path d="M 840 104 V 148" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#context-loop-link)"/>
    <path d="M 760 180 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-loop-arrow)"/>
    <path d="M 520 180 H 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-loop-arrow)"/>
    <path d="M 360 148 V 104" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#context-loop-arrow)"/>

    <g>
      <rect x="40" y="40" width="160" height="64" rx="6" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
      <text x="120" y="64" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">任务输入</text>
      <text x="120" y="84" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">user · event</text>
    </g>
    <g>
      <rect x="280" y="40" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="360" y="64" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">上下文组装</text>
      <text x="360" y="84" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">state · history · tools</text>
    </g>
    <g>
      <rect x="520" y="40" width="160" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="600" y="64" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">模型决策</text>
      <text x="600" y="84" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">text · tool_call</text>
    </g>
    <g>
      <rect x="760" y="40" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="840" y="64" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">工具执行</text>
      <text x="840" y="84" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">validate · run</text>
    </g>
    <g>
      <rect x="280" y="148" width="160" height="64" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="360" y="172" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">任务状态</text>
      <text x="360" y="192" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">goal · progress · budget</text>
    </g>
    <g>
      <rect x="520" y="148" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="600" y="172" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">结果标准化</text>
      <text x="600" y="192" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">source · status · error</text>
    </g>
    <g>
      <rect x="760" y="148" width="160" height="64" rx="6" fill="rgba(46,90,168,.05)" stroke="#2e5aa8"/>
      <text x="840" y="172" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">外部环境</text>
      <text x="840" y="192" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">web · files · APIs</text>
    </g>
  </svg>
</body>
</html>
