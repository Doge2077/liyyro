<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>状态的两种承载形态与迁移</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="csm-title csm-desc">
    <title id="csm-title">状态的两种承载形态与迁移</title>
    <desc id="csm-desc">状态可以留在会话历史里，由模型自己归纳；也可以外置为任务对象，由程序维护。前者换会话即丢，后者换执行者不丢，但需要额外的读写与同步成本。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="sm-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="sm-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="36" y="32" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">WHERE THE STATE LIVES</text>

    <g>
      <rect x="36" y="56" width="420" height="140" fill="#ececec" stroke="#7a8399"/>
      <text x="54" y="80" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">FORM A · IN SESSION</text>
      <text x="54" y="106" fill="#2d3142" font-size="14" font-weight="600">状态留在会话历史里</text>
      <text x="54" y="132" fill="#4f5d75" font-size="10">阶段、待办、已改文件都靠消息承载</text>
      <text x="54" y="152" fill="#4f5d75" font-size="10">谁执行，谁就拥有这份状态</text>
      <text x="54" y="176" fill="#7a8399" font-size="9">换会话 → 状态断；压缩 → 状态可能被摘掉</text>
    </g>

    <g>
      <rect x="544" y="56" width="420" height="140" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="562" y="80" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">FORM B · IN TASK OBJECT</text>
      <text x="562" y="106" fill="#2d3142" font-size="14" font-weight="600">状态外置为任务对象</text>
      <text x="562" y="132" fill="#4f5d75" font-size="10">阶段、待办、授权、产物登记在独立对象里</text>
      <text x="562" y="152" fill="#4f5d75" font-size="10">执行者只是可替换的资源</text>
      <text x="562" y="176" fill="#7a8399" font-size="9">换执行者 → 重新绑定；崩溃 → 重新拉起</text>
    </g>

    <path d="M 246 196 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sm-ar)"/>
    <path d="M 754 196 V 232" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#sm-ac)"/>

    <path d="M 456 96 H 544" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sm-ar)"/>
    <text x="500" y="88" text-anchor="middle" fill="#7a8399" font-size="9">迁移</text>

    <g>
      <rect x="36" y="232" width="928" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="256" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">MIGRATION COST</text>
      <text x="54" y="280" fill="#4f5d75" font-size="10">迁移要做三件事：把会话里已被归纳的结论抽出来、给它定字段、让执行者每轮从对象读而不是从历史推。</text>
    </g>

    <g>
      <rect x="36" y="304" width="928" height="72" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="328" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">THE PARTIAL MIGRATION THAT FAILS</text>
      <text x="54" y="352" fill="#2d3142" font-size="12" font-weight="600">只迁移一半比不迁移更糟</text>
      <text x="54" y="370" fill="#4f5d75" font-size="10">状态写进了对象，但执行者仍从会话历史推断当前阶段——两份状态会分叉，且没人知道哪份是真的。</text>
    </g>
  </svg>
</body>
</html>
