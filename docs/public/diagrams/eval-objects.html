<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>评估的六个核心对象</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eo-title eo-desc">
    <title id="eo-title">评估的六个核心对象</title>
    <desc id="eo-desc">任务定义输入与成功条件，尝试是一次运行，轨迹是过程记录，结果是业务状态，评分器给出判断，套件组织回归。</desc>
    <rect width="1000" height="340" fill="#f5f5f5"/>
    <defs>
      <marker id="eo-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">FROM OUTPUT TO BEHAVIOUR</text>

    <g>
      <rect x="40" y="60" width="150" height="110" fill="#ececec" stroke="#7a8399"/>
      <text x="115" y="86" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">任务</text>
      <text x="58" y="110" fill="#4f5d75" font-size="9">输入、环境、成功条件</text>
      <text x="58" y="130" fill="#7a8399" font-size="9">可判定、可复现</text>
      <text x="58" y="150" fill="#7a8399" font-size="9">有区分度</text>
    </g>
    <path d="M 190 115 H 222" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eo-ar)"/>

    <g>
      <rect x="222" y="60" width="150" height="110" fill="#fff" stroke="#2d3142"/>
      <text x="297" y="86" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">尝试</text>
      <text x="240" y="110" fill="#4f5d75" font-size="9">一次运行</text>
      <text x="240" y="130" fill="#7a8399" font-size="9">非确定性来源</text>
      <text x="240" y="150" fill="#7a8399" font-size="9">重复次数影响置信</text>
    </g>
    <path d="M 372 115 H 404" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eo-ar)"/>

    <g>
      <rect x="404" y="60" width="150" height="110" fill="#fff" stroke="#2d3142"/>
      <text x="479" y="86" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">轨迹</text>
      <text x="422" y="110" fill="#4f5d75" font-size="9">工具调用、检索、状态</text>
      <text x="422" y="130" fill="#7a8399" font-size="9">用于归因</text>
      <text x="422" y="150" fill="#7a8399" font-size="9">体积大，需采样</text>
    </g>
    <path d="M 554 115 H 586" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eo-ar)"/>

    <g>
      <rect x="586" y="60" width="150" height="110" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="661" y="86" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">结果</text>
      <text x="604" y="110" fill="#4f5d75" font-size="9">业务状态是否达成</text>
      <text x="604" y="130" fill="#7a8399" font-size="9">不依赖模型自述</text>
      <text x="604" y="150" fill="#7a8399" font-size="9">最可靠的一层</text>
    </g>
    <path d="M 736 115 H 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#eo-ar)"/>

    <g>
      <rect x="768" y="60" width="192" height="110" fill="#fff" stroke="#2d3142"/>
      <text x="864" y="86" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">评分器与套件</text>
      <text x="786" y="110" fill="#4f5d75" font-size="9">代码、规则、量表、人工</text>
      <text x="786" y="130" fill="#7a8399" font-size="9">套件组织回归与分层</text>
      <text x="786" y="150" fill="#7a8399" font-size="9">按任务族划分</text>
    </g>

    <g>
      <rect x="40" y="196" width="920" height="112" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="58" y="220" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">WHY SIX, NOT TWO</text>
      <text x="58" y="244" fill="#2d3142" font-size="12" font-weight="600">只有「输入」与「输出」两个对象时，失败无法归因</text>
      <text x="58" y="268" fill="#4f5d75" font-size="10">同一次失败可能是任务定义不清、单次运气差、过程违规，或评分器判错。四个对象各自对应一种。</text>
      <text x="58" y="292" fill="#7a8399" font-size="9">对象分开之后，「这次失败该改哪里」才有一个可执行的答案。</text>
    </g>

    <text x="40" y="332" fill="#7a8399" font-size="10">评估从「一次输出」扩展为「一次任务的一次尝试」。</text>
  </svg>
</body>
</html>
