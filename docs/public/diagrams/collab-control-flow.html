<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四种协作形态的控制流归属</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ccf-title ccf-desc">
    <title id="ccf-title">四种协作形态的控制流归属</title>
    <desc id="ccf-desc">中心编排由调度者持有控制流，对等移交由当前执行者转移控制流，共享黑板由参与者竞争写入，独立复核由复核者否决或放行。</desc>
    <rect width="1000" height="380" fill="#f5f5f5"/>
    <defs>
      <marker id="cf-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="cf-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">WHO HOLDS THE CONTROL FLOW</text>

    <g>
      <rect x="40" y="54" width="220" height="132" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="56" y="76" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">A · HUB</text>
      <text x="56" y="98" fill="#2d3142" font-size="14" font-weight="600">中心编排</text>
      <text x="56" y="120" fill="#4f5d75" font-size="10">调度者持有控制流</text>
      <text x="56" y="138" fill="#4f5d75" font-size="10">子任务之间不直接通信</text>
      <text x="56" y="160" fill="#7a8399" font-size="9">终止：调度者判定完成</text>
      <text x="56" y="176" fill="#7a8399" font-size="9">风险：单点判断错误放大</text>
    </g>
    <g>
      <rect x="280" y="54" width="220" height="132" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="296" y="76" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">B · RELAY</text>
      <text x="296" y="98" fill="#2d3142" font-size="14" font-weight="600">对等移交</text>
      <text x="296" y="120" fill="#4f5d75" font-size="10">当前执行者转出控制流</text>
      <text x="296" y="138" fill="#4f5d75" font-size="10">接收方成为新的持有者</text>
      <text x="296" y="160" fill="#7a8399" font-size="9">终止：无人可移交或目标达成</text>
      <text x="296" y="176" fill="#7a8399" font-size="9">风险：来回踢球</text>
    </g>
    <g>
      <rect x="520" y="54" width="220" height="132" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="536" y="76" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">C · BOARD</text>
      <text x="536" y="98" fill="#2d3142" font-size="14" font-weight="600">共享黑板</text>
      <text x="536" y="120" fill="#4f5d75" font-size="10">无单一持有者，靠写入竞争</text>
      <text x="536" y="138" fill="#4f5d75" font-size="10">状态即协调介质</text>
      <text x="536" y="160" fill="#7a8399" font-size="9">终止：黑板进入收敛态</text>
      <text x="536" y="176" fill="#7a8399" font-size="9">风险：写入冲突与活锁</text>
    </g>
    <g>
      <rect x="760" y="54" width="200" height="132" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="776" y="76" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">D · CHECK</text>
      <text x="776" y="98" fill="#2d3142" font-size="14" font-weight="600">独立复核</text>
      <text x="776" y="120" fill="#4f5d75" font-size="10">执行方与判定方分离</text>
      <text x="776" y="138" fill="#4f5d75" font-size="10">判定方只否决或放行</text>
      <text x="776" y="160" fill="#7a8399" font-size="9">终止：判定给出结论</text>
      <text x="776" y="176" fill="#7a8399" font-size="9">风险：判定方信息不足</text>
    </g>

    <path d="M 190 200 V 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cf-ar)"/>
    <path d="M 390 200 V 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cf-ar)"/>
    <path d="M 630 200 V 236" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#cf-ac)"/>
    <path d="M 860 200 V 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cf-ar)"/>

    <g>
      <rect x="40" y="236" width="920" height="96" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="56" y="260" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">SAME THREE FAILURE MODES, DIFFERENT OWNER</text>
      <text x="56" y="284" fill="#2d3142" font-size="12" font-weight="600">责任稀释：出了错谁认领，取决于控制流持有者</text>
      <text x="56" y="304" fill="#4f5d75" font-size="10">中心编排里责任在调度者，对等移交里在最后一位持有者，黑板里落在最后一次写入，复核里落在判定者。</text>
      <text x="56" y="322" fill="#4f5d75" font-size="10">形态选错时，最常见的症状是「大家都知道有问题，但没人负责修」。</text>
    </g>

    <text x="40" y="362" fill="#7a8399" font-size="10">控制流归属决定了三件事的答案：谁判断完成、谁承担失败、谁有权终止。</text>
  </svg>
</body>
</html>
