<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>九类失败按首个错误位置排列</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eat-title eat-desc">
    <title id="eat-title">九类失败按首个错误位置排列</title>
    <desc id="eat-desc">需求理解与流程规范类错误落在第一或第二个动作，工具调用与修改不完整类落在中段，信息反馈与过早停止类落在收尾。后续错误多为连锁反应，归因取最早且能解释后续的那个。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="ea-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="36" y="32" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">WHERE THE FIRST ERROR SITS</text>

    <line x1="80" y1="344" x2="952" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ea-ar)"/>
    <text x="80" y="368" fill="#7a8399" font-size="9">第一个动作</text>
    <text x="952" y="368" text-anchor="end" fill="#7a8399" font-size="9">收尾</text>

    <g>
      <rect x="80" y="60" width="260" height="60" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="96" y="84" fill="#2d3142" font-size="11" font-weight="600">需求理解与歧义处理</text>
      <text x="96" y="104" fill="#4f5d75" font-size="9">做出来的不是用户要的</text>
    </g>
    <g>
      <rect x="80" y="132" width="260" height="60" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="96" y="156" fill="#2d3142" font-size="11" font-weight="600">流程与规范缺失</text>
      <text x="96" y="176" fill="#4f5d75" font-size="9">未跑测试就提交、未写方案就改</text>
    </g>

    <g>
      <rect x="360" y="60" width="280" height="60" fill="#fff" stroke="#2d3142"/>
      <text x="376" y="84" fill="#2d3142" font-size="11" font-weight="600">工具调用错误</text>
      <text x="376" y="104" fill="#4f5d75" font-size="9">同一文件反复编辑失败、格式错误</text>
    </g>
    <g>
      <rect x="360" y="132" width="280" height="60" fill="#fff" stroke="#2d3142"/>
      <text x="376" y="156" fill="#2d3142" font-size="11" font-weight="600">修改不完整</text>
      <text x="376" y="176" fill="#4f5d75" font-size="9">改了签名漏了动态调用</text>
    </g>
    <g>
      <rect x="360" y="204" width="280" height="60" fill="#fff" stroke="#2d3142"/>
      <text x="376" y="228" fill="#2d3142" font-size="11" font-weight="600">hack 验证环境</text>
      <text x="376" y="248" fill="#4f5d75" font-size="9">改断言、加跳过、声称跑过</text>
    </g>
    <g>
      <rect x="360" y="276" width="280" height="60" fill="#fff" stroke="#2d3142"/>
      <text x="376" y="300" fill="#2d3142" font-size="11" font-weight="600">非功能性回归</text>
      <text x="376" y="320" fill="#4f5d75" font-size="9">改公开接口无迁移脚本</text>
    </g>

    <g>
      <rect x="664" y="60" width="288" height="60" fill="#fff" stroke="#7a8399"/>
      <text x="680" y="84" fill="#2d3142" font-size="11" font-weight="600">对用户的信息反馈错误</text>
      <text x="680" y="104" fill="#4f5d75" font-size="9">环境全对，告诉用户的却错了</text>
    </g>
    <g>
      <rect x="664" y="132" width="288" height="60" fill="#fff" stroke="#7a8399"/>
      <text x="680" y="156" fill="#2d3142" font-size="11" font-weight="600">过早停止任务</text>
      <text x="680" y="176" fill="#4f5d75" font-size="9">多目标任务只完成一部分</text>
    </g>
    <g>
      <rect x="664" y="204" width="288" height="60" fill="#fff" stroke="#7a8399"/>
      <text x="680" y="228" fill="#2d3142" font-size="11" font-weight="600">模型执行异常</text>
      <text x="680" y="248" fill="#4f5d75" font-size="9">截断、超时、未收尾即结束</text>
    </g>

    <g>
      <rect x="664" y="276" width="288" height="60" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="680" y="300" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">RULE</text>
      <text x="680" y="320" fill="#4f5d75" font-size="10">取最早且能解释后续的那个</text>
    </g>
  </svg>
</body>
</html>
