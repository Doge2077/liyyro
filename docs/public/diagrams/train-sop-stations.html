<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一次微调的七个站点与各站产出物</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tsop-title tsop-desc">
    <title id="tsop-title">一次微调的七个站点与各站产出物</title>
    <desc id="tsop-desc">数据、基线、显存账、配方、监控、评测、交付依次推进，每站留下一个可核对的产出物。基线决定要不要训，显存账决定怎么训，评测决定能不能交。</desc>
    <rect width="1000" height="340" fill="#f5f5f5"/>
    <defs>
      <marker id="tsop-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">SEVEN STATIONS, SEVEN OUTPUTS</text>

    <path d="M 160 100 H 180" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tsop-ar)"/>
    <path d="M 292 100 H 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tsop-ar)"/>
    <path d="M 424 100 H 444" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tsop-ar)"/>
    <path d="M 556 100 H 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tsop-ar)"/>
    <path d="M 688 100 H 708" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tsop-ar)"/>
    <path d="M 820 100 H 840" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tsop-ar)"/>

    <g>
      <rect x="48" y="64" width="112" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="64" width="112" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="104" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">数据</text>
      <text x="104" y="112" fill="#4f5d75" font-size="9" font-family="var(--mono)" text-anchor="middle">清洗 · 切分 · 查重</text>
    </g>

    <g>
      <rect x="180" y="64" width="112" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="180" y="64" width="112" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="236" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">基线</text>
      <text x="236" y="112" fill="#eb6c36" font-size="9" font-family="var(--mono)" text-anchor="middle">三个对照数字</text>
    </g>

    <g>
      <rect x="312" y="64" width="112" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="312" y="64" width="112" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="368" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">显存账</text>
      <text x="368" y="112" fill="#4f5d75" font-size="9" font-family="var(--mono)" text-anchor="middle">112 GB 还是 25 GB</text>
    </g>

    <g>
      <rect x="444" y="64" width="112" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="444" y="64" width="112" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="500" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">配方</text>
      <text x="500" y="112" fill="#4f5d75" font-size="9" font-family="var(--mono)" text-anchor="middle">长度 · batch · 学习率</text>
    </g>

    <g>
      <rect x="576" y="64" width="112" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="64" width="112" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="632" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">监控</text>
      <text x="632" y="112" fill="#4f5d75" font-size="9" font-family="var(--mono)" text-anchor="middle">四条曲线</text>
    </g>

    <g>
      <rect x="708" y="64" width="112" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="708" y="64" width="112" height="72" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="764" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">评测</text>
      <text x="764" y="112" fill="#eb6c36" font-size="9" font-family="var(--mono)" text-anchor="middle">三个种子的方差</text>
    </g>

    <g>
      <rect x="840" y="64" width="112" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="64" width="112" height="72" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="896" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--sans)" text-anchor="middle">交付</text>
      <text x="896" y="112" fill="#4f5d75" font-size="9" font-family="var(--mono)" text-anchor="middle">五样东西</text>
    </g>

    <text x="48" y="164" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">产出物</text>
    <text x="48" y="184" fill="#4f5d75" font-size="9" font-family="var(--sans)">数据版本哈希</text>
    <text x="180" y="184" fill="#4f5d75" font-size="9" font-family="var(--sans)">0.61 / 0.72 / 0.78</text>
    <text x="312" y="184" fill="#4f5d75" font-size="9" font-family="var(--sans)">显存预算表</text>
    <text x="444" y="184" fill="#4f5d75" font-size="9" font-family="var(--sans)">训练配置</text>
    <text x="576" y="184" fill="#4f5d75" font-size="9" font-family="var(--sans)">四张曲线图</text>
    <text x="708" y="184" fill="#4f5d75" font-size="9" font-family="var(--sans)">混淆矩阵</text>
    <text x="840" y="184" fill="#4f5d75" font-size="9" font-family="var(--sans)">可复现包</text>

    <line x1="48" y1="212" x2="952" y2="212" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

    <text x="48" y="240" fill="#eb6c36" font-size="9" font-family="var(--mono)" letter-spacing=".1em">基线</text>
    <text x="48" y="262" fill="#2d3142" font-size="10" font-family="var(--sans)">微调打不过 0.78 就不该走后面六站：训练管线的维护成本换不回两个点。</text>

    <text x="48" y="292" fill="#eb6c36" font-size="9" font-family="var(--mono)" letter-spacing=".1em">评测</text>
    <text x="48" y="314" fill="#2d3142" font-size="10" font-family="var(--sans)">八个点的差距才立得住结论，两个点落在种子波动里，不作为交付依据。</text>
  </svg>
</body>
</html>
