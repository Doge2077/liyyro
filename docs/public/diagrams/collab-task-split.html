<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一个任务拆给三个执行者之后的数据流</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cts-title cts-desc">
    <title id="cts-title">一个任务拆给三个执行者之后的数据流</title>
    <desc id="cts-desc">主 Agent 把一个任务拆成查日志、改配置、跑验证三件，各自拿一份任务描述独立执行，结果回到主 Agent 汇总。三处容易出事：互相等待、状态只留在会话里、权限随上下文一起传下去。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="ts-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0,0 8,3 0,6" fill="#4f5d75"/>
      </marker>
      <marker id="ts-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0,0 8,3 0,6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="36" y="30" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">ONE TASK, THREE EXECUTORS</text>

    <g>
      <rect x="36" y="52" width="180" height="66" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="54" y="78" fill="#2d3142" font-size="12" font-weight="600">主 Agent</text>
      <text x="54" y="100" fill="#4f5d75" font-size="9">拆任务、派发、汇总</text>
    </g>

    <path d="M 216 74 H 268 V 84 H 316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ts-ar)"/>
    <path d="M 216 85 H 316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ts-ar)"/>
    <path d="M 216 96 H 268 V 176 H 316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ts-ar)"/>

    <g>
      <rect x="316" y="52" width="300" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="334" y="76" fill="#2d3142" font-size="12" font-weight="600">查日志</text>
      <text x="334" y="98" fill="#4f5d75" font-size="9">只读 · 需要检索工具 · 出去的是结论</text>
    </g>
    <g>
      <rect x="316" y="126" width="300" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="334" y="150" fill="#2d3142" font-size="12" font-weight="600">改配置</text>
      <text x="334" y="172" fill="#4f5d75" font-size="9">可写 · 需要写文件工具 · 出去的是改动摘要</text>
    </g>
    <g>
      <rect x="316" y="200" width="300" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="334" y="224" fill="#2d3142" font-size="12" font-weight="600">跑验证</text>
      <text x="334" y="246" fill="#4f5d75" font-size="9">可执行 · 需要命令工具 · 出去的是通过与否</text>
    </g>

    <path d="M 616 84 H 664 V 152 H 700" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ts-ar)"/>
    <path d="M 616 158 H 700" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ts-ar)"/>
    <path d="M 616 232 H 664 V 164 H 700" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ts-ar)"/>

    <g>
      <rect x="700" y="120" width="264" height="76" fill="#ececec" stroke="#7a8399"/>
      <text x="718" y="146" fill="#2d3142" font-size="12" font-weight="600">汇总回主 Agent</text>
      <text x="718" y="168" fill="#4f5d75" font-size="9">三份结果按什么顺序读</text>
      <text x="718" y="184" fill="#4f5d75" font-size="9">谁判断「这次算不算完成」</text>
    </g>

    <text x="36" y="288" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">THREE PLACES IT GOES WRONG</text>

    <g>
      <rect x="36" y="300" width="300" height="72" fill="#fff" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="54" y="322" fill="#2d3142" font-size="11" font-weight="600">互相等</text>
      <text x="54" y="342" fill="#4f5d75" font-size="9">改配置等验证确认，验证等改配置通知，</text>
      <text x="54" y="358" fill="#4f5d75" font-size="9">主 Agent 在等三方完成。</text>
    </g>
    <g>
      <rect x="352" y="300" width="300" height="72" fill="#fff" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="370" y="322" fill="#2d3142" font-size="11" font-weight="600">状态断</text>
      <text x="370" y="342" fill="#4f5d75" font-size="9">阶段、待办、已改文件只在会话历史里，</text>
      <text x="370" y="358" fill="#4f5d75" font-size="9">换一次执行者就没了。</text>
    </g>
    <g>
      <rect x="668" y="300" width="296" height="72" fill="#fff" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="686" y="322" fill="#2d3142" font-size="11" font-weight="600">权限跟错人</text>
      <text x="686" y="342" fill="#4f5d75" font-size="9">父级的权限随着上下文一起传下去，</text>
      <text x="686" y="358" fill="#4f5d75" font-size="9">父级越权，子级跟着越权。</text>
    </g>
  </svg>
</body>
</html>
