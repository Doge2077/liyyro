<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识更新的两条路径与失效过滤</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rag-upd-title rag-upd-desc">
    <title id="rag-upd-title">知识更新的两条路径与失效过滤</title>
    <desc id="rag-upd-desc">增量更新由事件触发，提交小差异并经独立审核；定期整理从全局重新审视并回到原始证据核查；两者合入后重建索引，检索时按有效期过滤。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="ru-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="ru-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="44" y="42" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">INCREMENTAL</text>
    <text x="44" y="176" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">PERIODIC</text>

    <path d="M 208 108 H 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ru-ar)"/>
    <path d="M 418 108 H 458" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ru-ar)"/>
    <path d="M 628 108 H 668" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ru-ar)"/>

    <path d="M 208 242 H 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ru-ar)"/>
    <path d="M 418 242 H 458" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ru-ar)"/>
    <path d="M 628 242 H 668" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ru-ar)"/>

    <g>
      <rect x="44" y="76" width="164" height="64" fill="#ececec" stroke="#7a8399"/>
      <text x="126" y="100" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">新证据</text>
      <text x="126" y="120" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">one event</text>
    </g>
    <g>
      <rect x="248" y="76" width="170" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="333" y="100" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">提议小差异</text>
      <text x="333" y="120" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">write working branch</text>
    </g>
    <g>
      <rect x="458" y="76" width="170" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="543" y="100" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">独立审核</text>
      <text x="543" y="120" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">read-only + evidence</text>
    </g>
    <g>
      <rect x="668" y="76" width="288" height="64" fill="rgba(46,90,168,.06)" stroke="#2e5aa8"/>
      <text x="812" y="100" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">合入后重建受影响索引</text>
      <text x="812" y="120" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">index is derived</text>
    </g>

    <g>
      <rect x="44" y="210" width="164" height="64" fill="#ececec" stroke="#7a8399"/>
      <text x="126" y="234" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">周期触发</text>
      <text x="126" y="254" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">time · size · drift</text>
    </g>
    <g>
      <rect x="248" y="210" width="170" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="333" y="234" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">全量扫描</text>
      <text x="333" y="254" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">dedupe · merge · split</text>
    </g>
    <g>
      <rect x="458" y="210" width="170" height="64" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="543" y="234" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">回到原始证据</text>
      <text x="543" y="254" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">not summary to summary</text>
    </g>
    <g>
      <rect x="668" y="210" width="288" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="812" y="234" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">冲突保留与场景限定</text>
      <text x="812" y="254" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">qualify, don't guess</text>
    </g>

    <path d="M 956 108 H 972 V 242 H 960" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ru-ar)"/>
    <path d="M 812 274 V 300 H 500" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ru-ac)"/>

    <g>
      <rect x="200" y="300" width="300" height="56" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="350" y="322" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">检索期按有效期过滤</text>
      <text x="350" y="342" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">superseded → excluded</text>
    </g>

    <text x="44" y="384" fill="#7a8399" font-size="10">失效内容必须在下发前剔除：新旧两条同时被召回时，模型会给出自相矛盾的答案。</text>
  </svg>
</body>
</html>
