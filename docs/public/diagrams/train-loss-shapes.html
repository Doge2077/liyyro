<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四种训练曲线形态与对应判断</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tshape-title tshape-desc">
    <title id="tshape-title">四种训练曲线形态与对应判断</title>
    <desc id="tshape-desc">正常下降时看分叉点，过拟合时停在分叉前，不学习时查学习率与标签，发散时回滚检查点并降学习率。train 实线、val 虚线。</desc>
    <rect width="1000" height="340" fill="#f5f5f5"/>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">TRAIN SOLID · VAL DASHED</text>

    <g>
      <rect x="40" y="56" width="216" height="132" fill="#fff" stroke="#2d3142"/>
      <text x="56" y="78" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">NORMAL</text>
      <path d="M 68 108 L 96 128 L 124 144 L 152 154 L 180 160 L 216 164" fill="none" stroke="#2d3142" stroke-width="1.4"/>
      <path d="M 68 116 L 96 138 L 124 152 L 152 160 L 180 164 L 216 168" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="56" y="176" fill="#4f5d75" font-size="9" font-family="var(--sans)">两条线一起降</text>
    </g>

    <g>
      <rect x="272" y="56" width="216" height="132" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="288" y="78" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">OVERFIT</text>
      <path d="M 300 108 L 328 124 L 356 136 L 384 144 L 412 148 L 448 150" fill="none" stroke="#2d3142" stroke-width="1.4"/>
      <path d="M 300 116 L 328 134 L 356 148 L 384 158 L 412 164 L 448 170" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3"/>
      <line x1="384" y1="90" x2="384" y2="180" stroke="#eb6c36" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="288" y="176" fill="#4f5d75" font-size="9" font-family="var(--sans)">停在分叉点之前</text>
    </g>

    <g>
      <rect x="504" y="56" width="216" height="132" fill="#fff" stroke="#2d3142"/>
      <text x="520" y="78" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">NO LEARNING</text>
      <path d="M 532 96 L 560 100 L 588 98 L 616 102 L 644 100 L 680 102" fill="none" stroke="#2d3142" stroke-width="1.4"/>
      <path d="M 532 104 L 560 108 L 588 106 L 616 110 L 644 108 L 680 110" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="520" y="176" fill="#4f5d75" font-size="9" font-family="var(--sans)">查学习率与标签</text>
    </g>

    <g>
      <rect x="736" y="56" width="216" height="132" fill="#fff" stroke="#2d3142"/>
      <text x="752" y="78" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">DIVERGE</text>
      <path d="M 764 106 L 792 118 L 820 130 L 848 128 L 876 124 L 936 126" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
      <path d="M 764 106 L 792 118 L 820 130 L 848 96 L 876 128" fill="none" stroke="#2d3142" stroke-width="1.4"/>
      <circle cx="876" cy="128" r="3" fill="#2d3142"/>
      <text x="884" y="120" fill="#2d3142" font-size="8" font-family="var(--mono)">NaN</text>
      <text x="752" y="176" fill="#4f5d75" font-size="9" font-family="var(--sans)">回滚并降学习率</text>
    </g>

    <line x1="40" y1="212" x2="960" y2="212" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

    <text x="40" y="238" fill="#4f5d75" font-size="9" font-family="var(--mono)" letter-spacing=".1em">诊断顺序</text>
    <text x="40" y="262" fill="#2d3142" font-size="10" font-family="var(--sans)">先看形状再看数值：两条线同降是正常，val 回升是过拟合，都不动是没学到，跳高后归零是溢出。</text>
    <text x="40" y="286" fill="#2d3142" font-size="10" font-family="var(--sans)">形状之外还要看梯度范数：同步抬升说明是优化问题，只在单个 step 抬升说明是数据问题。</text>
    <text x="40" y="312" fill="#7a8399" font-size="9" font-family="var(--sans)">发散的处理顺序是回滚到上一个检查点、学习率减半重跑，不要在原地调参数。</text>
  </svg>
</body>
</html>
