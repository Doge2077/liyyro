<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五类工具与两条分类轴</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tfc-title tfc-desc">
    <title id="tfc-title">五类工具与两条分类轴</title>
    <desc id="tfc-desc">按调用方向与作用对象两条轴摆开五类工具：感知、执行、协作、用户沟通四类由 Agent 主动调用，事件触发类由外部触发。每类的设计重点落在不同的地方。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>

    <text x="36" y="30" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">FIVE KINDS, TWO AXES</text>

    <g>
      <rect x="36" y="48" width="180" height="30" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="48" y="68" fill="#7a8399" font-size="9" font-family="var(--mono)">工具类型</text>
      <rect x="216" y="48" width="150" height="30" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="228" y="68" fill="#7a8399" font-size="9" font-family="var(--mono)">调用方向</text>
      <rect x="366" y="48" width="150" height="30" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="378" y="68" fill="#7a8399" font-size="9" font-family="var(--mono)">作用对象</text>
      <rect x="516" y="48" width="448" height="30" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="528" y="68" fill="#7a8399" font-size="9" font-family="var(--mono)">例子与设计重点</text>
    </g>

    <g>
      <rect x="36" y="78" width="180" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="48" y="104" fill="#2d3142" font-size="12" font-weight="600">感知</text>
      <text x="48" y="124" fill="#7a8399" font-size="9">获取信息</text>
      <rect x="216" y="78" width="150" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="228" y="113" fill="#4f5d75" font-size="10">Agent 主动调用</text>
      <rect x="366" y="78" width="150" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="378" y="113" fill="#4f5d75" font-size="10">读外部状态</text>
      <rect x="516" y="78" width="448" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="528" y="100" fill="#4f5d75" font-size="9">网页搜索、知识库检索、读文件、搜文件内容</text>
      <text x="528" y="122" fill="#7a8399" font-size="9">重点：一次返回多少，怎么分页，超阈值怎么截</text>
    </g>

    <g>
      <rect x="36" y="138" width="180" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="48" y="164" fill="#2d3142" font-size="12" font-weight="600">执行</text>
      <text x="48" y="184" fill="#7a8399" font-size="9">改变世界</text>
      <rect x="216" y="138" width="150" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="228" y="173" fill="#4f5d75" font-size="10">Agent 主动调用</text>
      <rect x="366" y="138" width="150" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="378" y="173" fill="#4f5d75" font-size="10">改外部状态</text>
      <rect x="516" y="138" width="448" height="60" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="528" y="160" fill="#4f5d75" font-size="9">执行命令、写文件、调外部接口、发邮件</text>
      <text x="528" y="182" fill="#7a8399" font-size="9">重点：错误代价高，安全约束是核心</text>
    </g>

    <g>
      <rect x="36" y="198" width="180" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="48" y="224" fill="#2d3142" font-size="12" font-weight="600">协作</text>
      <text x="48" y="244" fill="#7a8399" font-size="9">驱动别的执行者</text>
      <rect x="216" y="198" width="150" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="228" y="233" fill="#4f5d75" font-size="10">Agent 主动调用</text>
      <rect x="366" y="198" width="150" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="378" y="233" fill="#4f5d75" font-size="10">另一个 Agent 或人</text>
      <rect x="516" y="198" width="448" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="528" y="220" fill="#4f5d75" font-size="9">创建子 Agent、给子 Agent 发消息、取消、列举</text>
      <text x="528" y="242" fill="#7a8399" font-size="9">重点：谁持有控制流，谁承担失败</text>
    </g>

    <g>
      <rect x="36" y="258" width="180" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="48" y="284" fill="#2d3142" font-size="12" font-weight="600">用户沟通</text>
      <text x="48" y="304" fill="#7a8399" font-size="9">向人传递信息</text>
      <rect x="216" y="258" width="150" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="228" y="293" fill="#4f5d75" font-size="10">Agent 主动调用</text>
      <rect x="366" y="258" width="150" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="378" y="293" fill="#4f5d75" font-size="10">人</text>
      <rect x="516" y="258" width="448" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="528" y="280" fill="#4f5d75" font-size="9">回复消息、发结构化卡片、发通知</text>
      <text x="528" y="302" fill="#7a8399" font-size="9">重点：人可能不在线，要多渠道异步触达</text>
    </g>

    <g>
      <rect x="36" y="318" width="180" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="48" y="344" fill="#2d3142" font-size="12" font-weight="600">事件触发</text>
      <text x="48" y="364" fill="#7a8399" font-size="9">唤醒 Agent</text>
      <rect x="216" y="318" width="150" height="60" fill="#ececec" stroke="#7a8399"/>
      <text x="228" y="345" fill="#4f5d75" font-size="10">Agent 注册</text>
      <text x="228" y="363" fill="#4f5d75" font-size="10">外部触发</text>
      <rect x="366" y="318" width="150" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="378" y="353" fill="#4f5d75" font-size="10">Agent 自己</text>
      <rect x="516" y="318" width="448" height="60" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="528" y="340" fill="#4f5d75" font-size="9">定时器、监控后台命令、接外部事件源</text>
      <text x="528" y="362" fill="#7a8399" font-size="9">重点：注册时声明关心什么，触发时怎么唤醒</text>
    </g>
  </svg>
</body>
</html>
