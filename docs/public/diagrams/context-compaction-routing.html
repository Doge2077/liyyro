<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上下文压缩与隔离</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:auto; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compaction-title compaction-desc">
    <title id="compaction-title">上下文压缩与隔离</title>
    <desc id="compaction-desc">根据上下文使用率和任务类型，在保留、压缩、外置或交给子 Agent 之间选择处理方式。</desc>
    <rect width="1000" height="420" fill="#f5f5f5"/>
    <defs>
      <marker id="compaction-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="compaction-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      <marker id="compaction-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>

    <path d="M 194 94 H 286" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#compaction-arrow)"/>
    <path d="M 470 94 H 560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#compaction-arrow)"/>
    <path d="M 650 132 V 236 H 560" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#compaction-accent)"/>
    <path d="M 650 56 V 36 H 756 V 94" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#compaction-arrow)"/>
    <path d="M 650 132 V 320 H 756 V 280" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#compaction-link)"/>
    <path d="M 756 132 V 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#compaction-arrow)"/>

    <g>
      <rect x="42" y="62" width="152" height="64" rx="6" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
      <text x="118" y="86" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">任务上下文</text>
      <text x="118" y="106" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">history · results · state</text>
    </g>
    <g>
      <rect x="286" y="62" width="184" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="378" y="86" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">评估信息体积</text>
      <text x="378" y="106" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">tokens · next result · goal</text>
    </g>
    <g>
      <polygon points="650,56 712,94 650,132 588,94" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="650" y="91" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">中间结果</text>
      <text x="650" y="107" text-anchor="middle" fill="#4f5d75" font-size="9">是否应进入主上下文？</text>
    </g>
    <g>
      <rect x="756" y="62" width="184" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="848" y="86" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">保留原文</text>
      <text x="848" y="106" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">small · active evidence</text>
    </g>
    <g>
      <rect x="560" y="236" width="192" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <text x="656" y="260" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">任务相关压缩</text>
      <text x="656" y="280" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">facts · constraints · sources</text>
    </g>
    <g>
      <rect x="756" y="236" width="184" height="64" rx="6" fill="rgba(46,90,168,.05)" stroke="#2e5aa8"/>
      <text x="848" y="260" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">子 Agent 隔离</text>
      <text x="848" y="280" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">explore → concise result</text>
    </g>
    <g>
      <rect x="560" y="336" width="192" height="48" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="656" y="356" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">外部归档</text>
      <text x="656" y="372" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">raw artifact · source URL</text>
    </g>

    <text x="536" y="84" text-anchor="end" fill="#7a8399" font-size="8" font-family="var(--mono)">small / needed now</text>
    <text x="716" y="220" fill="#7a8399" font-size="8" font-family="var(--mono)">large / reusable</text>
    <text x="770" y="330" fill="#2e5aa8" font-size="8" font-family="var(--mono)">large exploration</text>
  </svg>
</body>
</html>
