<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上下文压缩与隔离</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compaction-title compaction-desc">
    <title id="compaction-title">上下文压缩与隔离</title>
    <desc id="compaction-desc">运行时根据中间结果的体积和用途，在原文保留、任务压缩和子 Agent 隔离之间选择，并保存原始产物。</desc>
    <rect width="1000" height="360" fill="#f5f5f5"/>
    <defs>
      <marker id="compaction-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="compaction-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      <marker id="compaction-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>

    <path d="M 208 80 H 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#compaction-arrow)"/>
    <path d="M 472 80 H 552" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#compaction-arrow)"/>
    <path d="M 624 48 V 36 Q 624 28 632 28 H 788 Q 796 28 796 36 V 48" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#compaction-arrow)"/>
    <path d="M 600 112 V 144 Q 600 152 592 152 H 504 Q 496 152 496 160 V 184" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#compaction-accent)"/>
    <path d="M 648 112 V 144 Q 648 152 656 152 H 800 Q 808 152 808 160 V 184" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#compaction-link)"/>
    <path d="M 496 248 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#compaction-arrow)"/>

    <g>
      <rect x="40" y="48" width="168" height="64" rx="6" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
      <text x="124" y="72" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">任务上下文</text>
      <text x="124" y="92" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">history · results · state</text>
    </g>
    <g>
      <rect x="288" y="48" width="184" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="380" y="72" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">评估信息价值</text>
      <text x="380" y="92" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">size · reuse · next step</text>
    </g>
    <g>
      <polygon points="624,48 696,80 624,112 552,80" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="624" y="77" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">选择处理方式</text>
      <text x="624" y="93" text-anchor="middle" fill="#4f5d75" font-size="9">体积与任务相关性</text>
    </g>
    <g>
      <rect x="796" y="48" width="164" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="878" y="72" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">保留原文</text>
      <text x="878" y="92" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">small · needed now</text>
    </g>
    <g>
      <rect x="400" y="184" width="192" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <text x="496" y="208" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">任务相关压缩</text>
      <text x="496" y="228" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">facts · constraints · sources</text>
    </g>
    <g>
      <rect x="712" y="184" width="192" height="64" rx="6" fill="rgba(46,90,168,.05)" stroke="#2e5aa8"/>
      <text x="808" y="208" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">子 Agent 隔离</text>
      <text x="808" y="228" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">explore · concise result</text>
    </g>
    <g>
      <rect x="400" y="288" width="192" height="48" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="496" y="308" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">外部归档</text>
      <text x="496" y="324" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">raw artifact · source URL</text>
    </g>
  </svg>
</body>
</html>
