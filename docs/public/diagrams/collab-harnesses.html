<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四家协作结构的派生与隔离</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch-title ch-desc">
    <title id="ch-title">四家协作结构的派生与隔离</title>
    <desc id="ch-desc">Claude Code 用角色化子代理加进程内分叉，Codex 用任务式派生加消息传递，OpenCode 用配置化的子代理类型，DeepSeek Harness 用注册表化的委派后端与团队机制。</desc>
    <rect width="1000" height="420" fill="#f5f5f5"/>
    <defs>
      <marker id="ch-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="36" y="32" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">PARENT → CHILD, FOUR DESIGNS</text>

    <g>
      <rect x="36" y="52" width="150" height="56" fill="#ececec" stroke="#7a8399"/>
      <text x="111" y="76" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">父会话</text>
      <text x="111" y="94" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">parent</text>
    </g>
    <path d="M 186 80 H 226" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ch-ar)"/>

    <g>
      <rect x="226" y="46" width="200" height="68" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="242" y="68" fill="#2d3142" font-size="12" font-weight="600">Claude Code</text>
      <text x="242" y="86" fill="#4f5d75" font-size="9">角色化子代理 + 进程内分叉</text>
      <text x="242" y="102" fill="#7a8399" font-size="9">Explore 禁编辑；fork 继承前缀</text>
    </g>
    <g>
      <rect x="446" y="46" width="200" height="68" fill="#fff" stroke="#2d3142"/>
      <text x="462" y="68" fill="#2d3142" font-size="12" font-weight="600">Codex</text>
      <text x="462" y="86" fill="#4f5d75" font-size="9">任务式派生 + 消息传递</text>
      <text x="462" y="102" fill="#7a8399" font-size="9">spawn / send / wait / interrupt</text>
    </g>
    <g>
      <rect x="666" y="46" width="200" height="68" fill="#fff" stroke="#2d3142"/>
      <text x="682" y="68" fill="#2d3142" font-size="12" font-weight="600">OpenCode</text>
      <text x="682" y="86" fill="#4f5d75" font-size="9">配置化的子代理类型</text>
      <text x="682" y="102" fill="#7a8399" font-size="9">primary / subagent 两种模式</text>
    </g>
    <g>
      <rect x="886" y="46" width="90" height="68" fill="#fff" stroke="#2d3142"/>
      <text x="931" y="68" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">DSH</text>
      <text x="931" y="86" text-anchor="middle" fill="#4f5d75" font-size="9">委派</text>
      <text x="931" y="102" text-anchor="middle" fill="#7a8399" font-size="9">注册表</text>
    </g>

    <line x1="36" y1="134" x2="964" y2="134" stroke="rgba(45,49,66,.12)"/>

    <text x="36" y="158" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">ISOLATION</text>
    <g>
      <rect x="226" y="170" width="200" height="88" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="242" y="192" fill="#4f5d75" font-size="10">隔离粒度：会话</text>
      <text x="242" y="210" fill="#4f5d75" font-size="10">继承：fork 带全量前缀</text>
      <text x="242" y="228" fill="#4f5d75" font-size="10">收窄：按角色禁用工具</text>
      <text x="242" y="246" fill="#7a8399" font-size="9">回报：最终消息回父</text>
    </g>
    <g>
      <rect x="446" y="170" width="200" height="88" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="462" y="192" fill="#4f5d75" font-size="10">隔离粒度：会话</text>
      <text x="462" y="210" fill="#4f5d75" font-size="10">继承：全新上下文</text>
      <text x="462" y="228" fill="#4f5d75" font-size="10">收窄：协作模式限定</text>
      <text x="462" y="246" fill="#7a8399" font-size="9">回报：消息 + 等待</text>
    </g>
    <g>
      <rect x="666" y="170" width="200" height="88" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="682" y="192" fill="#4f5d75" font-size="10">隔离粒度：会话</text>
      <text x="682" y="210" fill="#4f5d75" font-size="10">继承：由类型定义</text>
      <text x="682" y="228" fill="#4f5d75" font-size="10">收窄：权限动作声明</text>
      <text x="682" y="246" fill="#7a8399" font-size="9">回报：任务输出</text>
    </g>
    <g>
      <rect x="886" y="170" width="90" height="88" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="931" y="192" text-anchor="middle" fill="#4f5d75" font-size="9">后端</text>
      <text x="931" y="210" text-anchor="middle" fill="#4f5d75" font-size="9">可选</text>
      <text x="931" y="228" text-anchor="middle" fill="#4f5d75" font-size="9">跨运行时</text>
      <text x="931" y="246" text-anchor="middle" fill="#7a8399" font-size="9">工具回报</text>
    </g>

    <g>
      <rect x="36" y="284" width="928" height="112" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="308" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">THE AXIS THAT ACTUALLY DIFFERS</text>
      <text x="54" y="332" fill="#2d3142" font-size="12" font-weight="600">差别不在「有没有子代理」，在「子代理能看到多少父级历史」</text>
      <text x="54" y="354" fill="#4f5d75" font-size="10">全新上下文：任务必须自包含，父级要显式传递目标、范围、完成标准。</text>
      <text x="54" y="372" fill="#4f5d75" font-size="10">继承前缀：省去交代，但子代理会继承父级的全部噪声，也不易判断它读了哪些。</text>
      <text x="54" y="390" fill="#7a8399" font-size="9">这一项决定了交接成本 $h$ 中的恢复项能不能被省掉。</text>
    </g>
  </svg>
</body>
</html>
