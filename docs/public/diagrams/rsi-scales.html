<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五个搜索尺度与外层成本</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rsc-title rsc-desc">
    <title id="rsc-title">五个搜索尺度与外层成本</title>
    <desc id="rsc-desc">优化对象从单条规则逐步扩大到优化器代码。越往外，单次验证越贵，可归因性越差，但改进的杠杆越大。</desc>
    <rect width="1000" height="340" fill="#f5f5f5"/>
    <defs>
      <marker id="rc2-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">INNER IS CHEAP, OUTER IS LEVERAGED</text>

    <g>
      <rect x="40" y="120" width="160" height="76" fill="#ececec" stroke="#7a8399"/>
      <text x="120" y="148" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">单条规则</text>
      <text x="120" y="170" text-anchor="middle" fill="#4f5d75" font-size="9">改一句话</text>
      <text x="120" y="186" text-anchor="middle" fill="#7a8399" font-size="9">验证：一次回放</text>
    </g>
    <path d="M 200 158 H 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc2-ar)"/>

    <g>
      <rect x="232" y="120" width="160" height="76" fill="#ececec" stroke="#7a8399"/>
      <text x="312" y="148" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">结构化上下文</text>
      <text x="312" y="170" text-anchor="middle" fill="#4f5d75" font-size="9">改条目组织</text>
      <text x="312" y="186" text-anchor="middle" fill="#7a8399" font-size="9">验证：一组回放</text>
    </g>
    <path d="M 392 158 H 424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc2-ar)"/>

    <g>
      <rect x="424" y="120" width="160" height="76" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="504" y="148" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">工作流</text>
      <text x="504" y="170" text-anchor="middle" fill="#4f5d75" font-size="9">改节点与分支</text>
      <text x="504" y="186" text-anchor="middle" fill="#7a8399" font-size="9">验证：一个任务族</text>
    </g>
    <path d="M 584 158 H 616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc2-ar)"/>

    <g>
      <rect x="616" y="120" width="160" height="76" fill="#fff" stroke="#2d3142"/>
      <text x="696" y="148" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">框架代码</text>
      <text x="696" y="170" text-anchor="middle" fill="#4f5d75" font-size="9">改存储与检索</text>
      <text x="696" y="186" text-anchor="middle" fill="#7a8399" font-size="9">验证：全量回归</text>
    </g>
    <path d="M 776 158 H 808" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc2-ar)"/>

    <g>
      <rect x="808" y="120" width="156" height="76" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="886" y="148" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">优化器代码</text>
      <text x="886" y="170" text-anchor="middle" fill="#4f5d75" font-size="9">改探索策略</text>
      <text x="886" y="186" text-anchor="middle" fill="#7a8399" font-size="9">验证：元评估</text>
    </g>

    <path d="M 120 196 V 236" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
    <path d="M 886 196 V 236" fill="none" stroke="#7a8399" stroke-width="1.2"/>
    <line x1="120" y1="236" x2="886" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rc2-ar)"/>
    <text x="120" y="258" fill="#4f5d75" font-size="10">验证成本低、可归因</text>
    <text x="886" y="258" text-anchor="end" fill="#4f5d75" font-size="10">杠杆大、反馈慢</text>

    <g>
      <rect x="40" y="272" width="924" height="56" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="58" y="294" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">DEFAULT CHOICE</text>
      <text x="58" y="316" fill="#2d3142" font-size="12" font-weight="600">优先改最内层：作用面小、易归因、易回滚。只有内层确实改不动时才往外走。</text>
    </g>
  </svg>
</body>
</html>
