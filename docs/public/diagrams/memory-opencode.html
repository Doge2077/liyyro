<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode 的指令发现与重新注入</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="moc-title moc-desc">
    <title id="moc-title">OpenCode 的指令发现与重新注入</title>
    <desc id="moc-desc">全局指令文件与项目内由近及远的目录文件被合并为合成消息；读取更深文件时补入嵌套指令；压缩把合成消息挤掉后，下一次重新发现并补注入。</desc>
    <rect width="1000" height="320" fill="#f5f5f5"/>
    <defs>
      <marker id="mo-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="mo-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <path d="M 208 96 H 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mo-ar)"/>
    <path d="M 208 176 H 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mo-ar)"/>
    <path d="M 448 96 H 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mo-ar)"/>
    <path d="M 448 176 H 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mo-ar)"/>
    <path d="M 688 136 H 748" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mo-ar)"/>
    <path d="M 618 218 V 248 H 748" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#mo-ac)"/>

    <g>
      <rect x="48" y="64" width="160" height="64" fill="#ececec" stroke="#7a8399"/>
      <text x="128" y="92" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">全局指令</text>
      <text x="128" y="112" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">~/.config/AGENTS.md</text>
    </g>
    <g>
      <rect x="48" y="144" width="160" height="64" fill="#ececec" stroke="#7a8399"/>
      <text x="128" y="172" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">项目指令</text>
      <text x="128" y="192" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">near → far</text>
    </g>
    <g>
      <rect x="248" y="64" width="200" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="348" y="92" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">内容去重</text>
      <text x="348" y="112" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">identical content folds</text>
    </g>
    <g>
      <rect x="248" y="144" width="200" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="348" y="172" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">变更渲染</text>
      <text x="348" y="192" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">patch or replace</text>
    </g>

    <g>
      <rect x="488" y="64" width="200" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="588" y="92" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">合成消息</text>
      <text x="588" y="112" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">+ path ledger</text>
    </g>
    <g>
      <rect x="488" y="144" width="200" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="588" y="172" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">嵌套补入</text>
      <text x="588" y="192" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">after read</text>
    </g>

    <g>
      <rect x="748" y="104" width="204" height="64" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="850" y="132" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">模型上下文</text>
      <text x="850" y="152" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">instruction messages</text>
    </g>

    <g>
      <rect x="748" y="216" width="204" height="64" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="850" y="244" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">重新发现</text>
      <text x="850" y="264" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">after compaction</text>
    </g>

    <path d="M 850 168 V 216" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#mo-ac)"/>
    <text x="864" y="196" fill="#7a8399" font-size="9" font-family="var(--mono)">evicted</text>

    <line x1="48" y1="296" x2="952" y2="296" stroke="rgba(45,49,66,.12)"/>
    <text x="48" y="316" fill="#7a8399" font-size="10">没有记忆库：跨会话信息全部由人写的指令承载，会话内连续性交给压缩检查点。</text>
  </svg>
</body>
</html>
