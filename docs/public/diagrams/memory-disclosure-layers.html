<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记忆的三层披露结构</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mem-layer-title mem-layer-desc">
    <title id="mem-layer-title">记忆的三层披露结构</title>
    <desc id="mem-layer-desc">索引层每轮常驻，只放一行指针；主题文件按命中展开；原始轨迹仅在核对与追溯时读取。</desc>
    <rect width="1000" height="360" fill="#f5f5f5"/>
    <defs>
      <marker id="mp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="mp-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="48" y="40" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">DISCLOSURE DEPTH</text>

    <path d="M 330 118 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mp-arrow)"/>
    <path d="M 330 250 H 380" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#mp-accent)"/>
    <path d="M 640 118 H 700" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mp-arrow)"/>
    <path d="M 640 250 H 700" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mp-arrow)"/>

    <g>
      <rect x="48" y="72" width="282" height="92" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="66" y="96" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">LAYER 1 · ALWAYS</text>
      <text x="66" y="120" fill="#2d3142" font-size="15" font-weight="600">索引</text>
      <text x="66" y="140" fill="#4f5d75" font-size="10">每条一行：标题 · 文件名 · 一句话钩子</text>
      <text x="66" y="156" fill="#7a8399" font-size="9" font-family="var(--mono)">200 行 / 25 KB 上限</text>
    </g>

    <g>
      <rect x="380" y="72" width="260" height="92" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="398" y="96" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">LAYER 2 · ON HIT</text>
      <text x="398" y="120" fill="#2d3142" font-size="15" font-weight="600">主题文件</text>
      <text x="398" y="140" fill="#4f5d75" font-size="10">一条记忆的完整正文与来源</text>
      <text x="398" y="156" fill="#7a8399" font-size="9" font-family="var(--mono)">单文件告警 40,000 字符</text>
    </g>

    <g>
      <rect x="700" y="72" width="252" height="92" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="718" y="96" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">LAYER 3 · ON VERIFY</text>
      <text x="718" y="120" fill="#2d3142" font-size="15" font-weight="600">原始轨迹</text>
      <text x="718" y="140" fill="#4f5d75" font-size="10">只追加的事件记录</text>
      <text x="718" y="156" fill="#7a8399" font-size="9" font-family="var(--mono)">按需检索，不整体读入</text>
    </g>

    <g>
      <rect x="48" y="204" width="282" height="92" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="66" y="228" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">SELECTION</text>
      <text x="66" y="252" fill="#2d3142" font-size="15" font-weight="600">按需挑选</text>
      <text x="66" y="272" fill="#4f5d75" font-size="10">一次模型调用从清单里选最多 5 份</text>
      <text x="66" y="288" fill="#7a8399" font-size="9" font-family="var(--mono)">附新鲜度与陈旧提醒</text>
    </g>

    <g>
      <rect x="380" y="204" width="260" height="92" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="398" y="228" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">STALENESS</text>
      <text x="398" y="252" fill="#2d3142" font-size="15" font-weight="600">新鲜度标注</text>
      <text x="398" y="272" fill="#4f5d75" font-size="10">相对时间比时间戳更容易触发核对</text>
      <text x="398" y="288" fill="#7a8399" font-size="9" font-family="var(--mono)">超过一天附陈旧说明</text>
    </g>

    <g>
      <rect x="700" y="204" width="252" height="92" fill="rgba(46,90,168,.06)" stroke="#2e5aa8"/>
      <text x="718" y="228" fill="#2e5aa8" font-size="8" font-family="var(--mono)" letter-spacing=".1em">RETENTION</text>
      <text x="718" y="252" fill="#2d3142" font-size="15" font-weight="600">来源绑定</text>
      <text x="718" y="272" fill="#4f5d75" font-size="10">每条记忆可回到产生它的那次操作</text>
      <text x="718" y="288" fill="#7a8399" font-size="9" font-family="var(--mono)">整理后仍然保留</text>
    </g>

    <text x="48" y="336" fill="#7a8399" font-size="10">披露深度与 Token 成本成反比：越深的层越少被加载，但决定了结论能否被核对。</text>
  </svg>
</body>
</html>
