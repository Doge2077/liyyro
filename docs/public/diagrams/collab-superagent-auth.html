<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>两条路径与三档授权强度</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="csa-title csa-desc">
    <title id="csa-title">两条路径与三档授权强度</title>
    <desc id="csa-desc">评估路径经过准入与研判才能创建工单，订阅扇出只提供上下文而不授予权限。三档强度分别是显式请求、推断候选与不准入。</desc>
    <rect width="1000" height="360" fill="#f5f5f5"/>
    <defs>
      <marker id="sa-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="sa-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="36" y="32" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">AUTHORITY VS CONTEXT</text>

    <path d="M 190 88 H 240" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#sa-ac)"/>
    <path d="M 420 88 H 470" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#sa-ac)"/>
    <path d="M 650 88 H 700" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#sa-ac)"/>

    <g>
      <rect x="36" y="60" width="154" height="56" fill="#fff" stroke="#2d3142"/>
      <text x="113" y="84" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600">触发到达</text>
      <text x="113" y="102" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">Gate</text>
    </g>
    <g>
      <rect x="240" y="60" width="180" height="56" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="330" y="84" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600">研判</text>
      <text x="330" y="102" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">Assessment</text>
    </g>
    <g>
      <rect x="470" y="60" width="180" height="56" fill="#fff" stroke="#2d3142"/>
      <text x="560" y="84" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600">决定</text>
      <text x="560" y="102" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">Decision</text>
    </g>
    <g>
      <rect x="700" y="52" width="264" height="72" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="832" y="76" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600">工单 + 授权</text>
      <text x="832" y="96" text-anchor="middle" fill="#4f5d75" font-size="9">能做什么由授权决定</text>
      <text x="832" y="114" text-anchor="middle" fill="#7a8399" font-size="9">规则、范围、强度、策略版本</text>
    </g>

    <path d="M 560 148 V 196 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sa-ar)"/>
    <path d="M 380 200 H 700" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#sa-ar)"/>

    <g>
      <rect x="180" y="168" width="200" height="56" fill="#ececec" stroke="#7a8399"/>
      <text x="280" y="192" text-anchor="middle" fill="#2d3142" font-size="11" font-weight="600">订阅扇出</text>
      <text x="280" y="210" text-anchor="middle" fill="#4f5d75" font-size="9">只给上下文，不检查发送人</text>
    </g>

    <text x="700" y="204" fill="#7a8399" font-size="9">不收窄授权</text>

    <g>
      <rect x="36" y="244" width="300" height="52" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="266" fill="#2d3142" font-size="11" font-weight="600">显式请求</text>
      <text x="54" y="284" fill="#4f5d75" font-size="9">允许名单上的人直接点名智能体</text>
    </g>
    <g>
      <rect x="350" y="244" width="300" height="52" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="368" y="266" fill="#2d3142" font-size="11" font-weight="600">推断候选</text>
      <text x="368" y="284" fill="#4f5d75" font-size="9">名单外的人跟进，或机器人消息</text>
    </g>
    <g>
      <rect x="664" y="244" width="300" height="52" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="682" y="266" fill="#2d3142" font-size="11" font-weight="600">不准入</text>
      <text x="682" y="284" fill="#4f5d75" font-size="9">其余机器人、被忽略的接收范围</text>
    </g>

    <text x="36" y="330" fill="#7a8399" font-size="10">扇出不产生授权，所以越权讨论不会变成越权执行——代价是授权范围必须自己写全。</text>
    <text x="36" y="350" fill="#7a8399" font-size="10">三档强度与三态接受模式正交：强度决定「能不能」，模式决定「要不要自动接受」。</text>
  </svg>
</body>
</html>
