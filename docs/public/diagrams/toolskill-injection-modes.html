<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五种注入方式的成本与风险</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tim-title tim-desc">
    <title id="tim-title">五种注入方式的成本与风险</title>
    <desc id="tim-desc">从全量注入到命名空间分组，常驻成本依次下降而首次调用延迟依次上升。检索式发现的漏选风险最高，但它把无关工具完全排除在上下文之外。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="ti-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">RESIDENT COST DECREASES, LATENCY INCREASES</text>

    <path d="M 96 348 V 76" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ti-ar)"/>
    <text x="70" y="212" text-anchor="middle" fill="#4f5d75" font-size="11">常驻</text>
    <text x="70" y="230" text-anchor="middle" fill="#4f5d75" font-size="11">成本</text>
    <line x1="96" y1="348" x2="964" y2="348" stroke="#4f5d75" stroke-width="1.2"/>
    <line x1="96" y1="280" x2="964" y2="280" stroke="rgba(45,49,66,.10)"/>
    <line x1="96" y1="212" x2="964" y2="212" stroke="rgba(45,49,66,.10)"/>
    <line x1="96" y1="144" x2="964" y2="144" stroke="rgba(45,49,66,.10)"/>
    <line x1="96" y1="76" x2="964" y2="76" stroke="rgba(45,49,66,.10)"/>

    <g>
      <rect x="140" y="80" width="140" height="268" fill="rgba(45,49,66,.10)" stroke="#7a8399"/>
      <text x="210" y="112" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">全量注入</text>
      <text x="210" y="134" text-anchor="middle" fill="#4f5d75" font-size="9">全部定义常驻</text>
      <text x="210" y="330" text-anchor="middle" fill="#7a8399" font-size="9">零延迟</text>
      <text x="210" y="346" text-anchor="middle" fill="#7a8399" font-size="9">占窗口最大</text>
    </g>

    <g>
      <rect x="304" y="150" width="140" height="198" fill="rgba(45,49,66,.07)" stroke="#7a8399"/>
      <text x="374" y="182" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">核心常驻</text>
      <text x="374" y="204" text-anchor="middle" fill="#4f5d75" font-size="9">常用几个常驻</text>
      <text x="374" y="330" text-anchor="middle" fill="#7a8399" font-size="9">其余延迟</text>
      <text x="374" y="346" text-anchor="middle" fill="#7a8399" font-size="9">需一次搜索</text>
    </g>

    <g>
      <rect x="468" y="204" width="140" height="144" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="538" y="236" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">名称目录</text>
      <text x="538" y="258" text-anchor="middle" fill="#4f5d75" font-size="9">只常驻名字</text>
      <text x="538" y="330" text-anchor="middle" fill="#7a8399" font-size="9">按名加载 schema</text>
      <text x="538" y="346" text-anchor="middle" fill="#7a8399" font-size="9">目录仍占空间</text>
    </g>

    <g>
      <rect x="632" y="252" width="140" height="96" fill="#fff" stroke="#2d3142"/>
      <text x="702" y="284" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">检索式发现</text>
      <text x="702" y="306" text-anchor="middle" fill="#4f5d75" font-size="9">零常驻</text>
      <text x="702" y="330" text-anchor="middle" fill="#7a8399" font-size="9">两段式调用</text>
      <text x="702" y="346" text-anchor="middle" fill="#7a8399" font-size="9">漏选风险最高</text>
    </g>

    <g>
      <rect x="796" y="172" width="150" height="176" fill="#fff" stroke="#2d3142"/>
      <text x="871" y="204" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">命名空间分组</text>
      <text x="871" y="226" text-anchor="middle" fill="#4f5d75" font-size="9">按服务分组</text>
      <text x="871" y="330" text-anchor="middle" fill="#7a8399" font-size="9">组内仍需枚举</text>
      <text x="871" y="346" text-anchor="middle" fill="#7a8399" font-size="9">粒度介于两者</text>
    </g>

    <text x="40" y="382" fill="#7a8399" font-size="10">选择顺序：先看是否每轮都用，再看首次延迟能否接受，再看漏选代价，最后看缓存。</text>
  </svg>
</body>
</html>
