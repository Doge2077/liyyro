<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四段成本在编码变快之后的位置变化</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scost-title scost-desc">
    <title id="scost-title">四段成本在编码变快之后的位置变化</title>
    <desc id="scost-desc">总时间不变时，写出来这一段压缩，多出来的份额被验证与以后改得动两段吸收。想清楚这一段不受影响。示意，非实测比例。</desc>
    <rect width="1000" height="340" fill="#f5f5f5"/>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">FOUR SEGMENTS, ONE TOTAL</text>

    <text x="40" y="88" fill="#2d3142" font-size="11" font-weight="600" font-family="var(--sans)">编码变快之前</text>

    <g>
      <rect x="40" y="104" width="200" height="44" fill="#ececec" stroke="#7a8399" stroke-width="1"/>
      <rect x="240" y="104" width="280" height="44" fill="#ececec" stroke="#7a8399" stroke-width="1"/>
      <rect x="520" y="104" width="240" height="44" fill="#ececec" stroke="#7a8399" stroke-width="1"/>
      <rect x="760" y="104" width="200" height="44" fill="#ececec" stroke="#7a8399" stroke-width="1"/>
    </g>

    <text x="140" y="131" fill="#2d3142" font-size="10" font-family="var(--sans)" text-anchor="middle">想清楚</text>
    <text x="380" y="131" fill="#2d3142" font-size="10" font-family="var(--sans)" text-anchor="middle">写出来</text>
    <text x="640" y="131" fill="#2d3142" font-size="10" font-family="var(--sans)" text-anchor="middle">验证</text>
    <text x="860" y="131" fill="#2d3142" font-size="10" font-family="var(--sans)" text-anchor="middle">改得动</text>

    <text x="40" y="176" fill="#2d3142" font-size="11" font-weight="600" font-family="var(--sans)">编码变快之后</text>

    <g>
      <rect x="40" y="192" width="200" height="44" fill="#ececec" stroke="#7a8399" stroke-width="1"/>
      <rect x="240" y="192" width="100" height="44" fill="#fff" stroke="#2d3142" stroke-width="1.2"/>
      <rect x="340" y="192" width="380" height="44" fill="rgba(235,108,54,.10)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="720" y="192" width="240" height="44" fill="#ececec" stroke="#7a8399" stroke-width="1"/>
    </g>

    <text x="140" y="219" fill="#2d3142" font-size="10" font-family="var(--sans)" text-anchor="middle">想清楚</text>
    <text x="290" y="219" fill="#2d3142" font-size="10" font-family="var(--sans)" text-anchor="middle">写出来</text>
    <text x="530" y="219" fill="#eb6c36" font-size="10" font-family="var(--sans)" text-anchor="middle">验证：吸收掉压缩出的份额</text>
    <text x="840" y="219" fill="#2d3142" font-size="10" font-family="var(--sans)" text-anchor="middle">改得动</text>

    <path d="M 530 152 V 188" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="3,3"/>
    <path d="M 290 152 V 188" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,3"/>

    <line x1="40" y1="264" x2="960" y2="264" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

    <text x="40" y="290" fill="#2d3142" font-size="10" font-family="var(--sans)">总时间固定时，一段收缩必然由其余段吸收。编码从六成压到三成，多出来的三成流向验证与理解。</text>
    <text x="40" y="312" fill="#7a8399" font-size="9" font-family="var(--sans)">比例仅示意。想清楚这一段不由产出速度决定，它随需求歧义与系统耦合变化。</text>
  </svg>
</body>
</html>
