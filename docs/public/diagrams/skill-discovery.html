<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill 发现的三层来源与优先级</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skd-title skd-desc">
    <title id="skd-title">Skill 发现的三层来源与优先级</title>
    <desc id="skd-desc">项目、自定义与用户三个根目录被发现并监视；同层内按 rank、提供方顺序、本地顺序裁决重名；最近的 scope 层胜出。</desc>
    <rect width="1000" height="340" fill="#f5f5f5"/>
    <defs>
      <marker id="sk-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">DISCOVERY SOURCES</text>

    <g>
      <rect x="40" y="56" width="200" height="56" fill="#ececec" stroke="#7a8399"/>
      <text x="140" y="80" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">项目根</text>
      <text x="140" y="98" text-anchor="middle" fill="#4f5d75" font-size="9">仓库内，随版本走</text>
    </g>
    <g>
      <rect x="40" y="128" width="200" height="56" fill="#ececec" stroke="#7a8399"/>
      <text x="140" y="152" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">自定义根</text>
      <text x="140" y="170" text-anchor="middle" fill="#4f5d75" font-size="9">部署级，不随仓库</text>
    </g>
    <g>
      <rect x="40" y="200" width="200" height="56" fill="#ececec" stroke="#7a8399"/>
      <text x="140" y="224" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">用户根</text>
      <text x="140" y="242" text-anchor="middle" fill="#4f5d75" font-size="9">个人级，跨项目</text>
    </g>

    <path d="M 240 84 H 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sk-ar)"/>
    <path d="M 240 156 H 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sk-ar)"/>
    <path d="M 240 228 H 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sk-ar)"/>

    <g>
      <rect x="300" y="56" width="240" height="200" fill="#fff" stroke="#2d3142"/>
      <text x="420" y="80" text-anchor="middle" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">SCAN</text>
      <text x="420" y="108" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">目录 bundle 或平铺文件</text>
      <text x="420" y="132" text-anchor="middle" fill="#4f5d75" font-size="10">解析 frontmatter</text>
      <text x="420" y="154" text-anchor="middle" fill="#4f5d75" font-size="10">只扫根目录一层</text>
      <text x="420" y="176" text-anchor="middle" fill="#7a8399" font-size="9">刻意不支持嵌套发现</text>
      <text x="420" y="204" text-anchor="middle" fill="#4f5d75" font-size="10">监视变更并失效</text>
      <text x="420" y="226" text-anchor="middle" fill="#7a8399" font-size="9">新增、改名、删除即时可见</text>
    </g>

    <path d="M 540 156 H 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sk-ar)"/>

    <g>
      <rect x="600" y="56" width="360" height="200" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="618" y="80" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">ARBITRATION</text>
      <text x="618" y="108" fill="#2d3142" font-size="12" font-weight="600">重名怎么裁决</text>
      <text x="618" y="134" fill="#4f5d75" font-size="10">1. 最近的 scope 层直接胜出</text>
      <text x="618" y="156" fill="#4f5d75" font-size="10">2. 同层内先比 rank</text>
      <text x="618" y="178" fill="#4f5d75" font-size="10">3. 再比提供方注册顺序</text>
      <text x="618" y="200" fill="#4f5d75" font-size="10">4. 最后比本地目录顺序</text>
      <text x="618" y="228" fill="#7a8399" font-size="9">四步之后仍相同才视为同一份</text>
      <text x="618" y="246" fill="#7a8399" font-size="9">顺序固定，所以同名覆盖是可预测的</text>
    </g>

    <text x="40" y="292" fill="#7a8399" font-size="10">优先级固定带来一个代价：用户根的同名 Skill 永远盖不过项目根，即使它是更新版本。</text>
    <text x="40" y="316" fill="#7a8399" font-size="10">所以改名而不改内容的重命名，必须同时处理旧名字的残留，否则两个都会出现在目录里。</text>
  </svg>
</body>
</html>
