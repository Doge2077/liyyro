<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Runtime 架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:auto; display:block; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-runtime-architecture-title agent-runtime-architecture-desc">
      <title id="agent-runtime-architecture-title">Runtime 如何控制一次 Agent 任务</title>
      <desc id="agent-runtime-architecture-desc">图示 Runtime 组装上下文、调用模型、检查策略、执行工具、验证结果并保存状态；任务状态通过 checkpoint 回流到下一轮上下文。</desc>
      <defs>
        <marker id="runtime-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="runtime-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="runtime-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1000" height="400" fill="#f5f5f5"/>
      <rect x="32" y="20" width="936" height="64" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
      <rect x="32" y="100" width="936" height="184" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
      <rect x="32" y="300" width="936" height="56" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
      <rect x="48" y="24" width="80" height="16" rx="2" fill="#f5f5f5"/><text x="88" y="36" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">REQUEST</text>
      <rect x="48" y="104" width="80" height="16" rx="2" fill="#f5f5f5"/><text x="88" y="116" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">RUNTIME</text>
      <rect x="48" y="304" width="104" height="16" rx="2" fill="#f5f5f5"/><text x="100" y="316" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">ENVIRONMENT</text>

      <!-- connectors are drawn before nodes -->
      <path d="M 252,52 H 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
      <path d="M 576,52 H 660" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
      <path d="M 456,84 V 132" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
      <path d="M 252,168 H 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
      <path d="M 576,168 H 660" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#runtime-arrow-accent)"/>
      <path d="M 780,204 V 316" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#runtime-arrow-link)"/>
      <path d="M 660,328 H 576" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#runtime-arrow-link)"/>
      <path d="M 336,328 H 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#runtime-arrow)"/>
      <path d="M 252,330 H 288 Q 296,330 296,322 V 64 Q 296,56 304,56 H 336" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#runtime-arrow)"/>

      <g>
        <rect x="72" y="36" width="180" height="40" rx="6" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>

        <text x="162" y="68" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">goal · constraints</text>
      </g>
      <g>
        <rect x="336" y="28" width="240" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
        <text x="456" y="52" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">上下文组装</text>
        <text x="456" y="70" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">messages · state · tools</text>
      </g>
      <g>
        <rect x="660" y="28" width="240" height="56" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="780" y="52" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">LLM</text>
        <text x="780" y="70" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">decision · tool call</text>
      </g>
      <g>
        <rect x="72" y="148" width="180" height="56" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="162" y="171" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">策略与预算</text>
        <text x="162" y="189" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">policy · permission · cost</text>
      </g>
      <g>
        <rect x="336" y="140" width="240" height="56" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="456" y="163" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">验证与状态</text>
        <text x="456" y="181" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">schema · checkpoint · trace</text>
      </g>
      <g>
        <rect x="660" y="140" width="240" height="56" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="780" y="163" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">工具执行器</text>
        <text x="780" y="181" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">adapter · timeout · retry</text>
      </g>
      <g>
        <rect x="72" y="316" width="180" height="28" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
        <text x="162" y="334" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">任务状态</text>

      <g>

        <text x="780" y="334" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">外部环境 · web · docs · APIs</text>
      </g>

</html>
