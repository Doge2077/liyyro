<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工具与 Skill 的规模账</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tsc-title tsc-desc">
    <title id="tsc-title">工具与 Skill 的规模账</title>
    <desc id="tsc-desc">五类内容共同占用窗口：内置工具、MCP 工具、Skill 目录、系统提示与历史消息。工具与服务数量增长时，前三项按线性累加。</desc>
    <rect width="1000" height="340" fill="#f5f5f5"/>
    <defs>
      <marker id="tc-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">WHAT FILLS THE WINDOW</text>

    <g>
      <rect x="40" y="56" width="920" height="48" fill="rgba(45,49,66,.10)" stroke="#7a8399"/>
      <text x="58" y="78" fill="#2d3142" font-size="12" font-weight="600">系统提示</text>
      <text x="200" y="78" fill="#4f5d75" font-size="10">稳定前缀，缓存友好</text>
      <text x="920" y="78" text-anchor="end" fill="#7a8399" font-size="10" font-family="var(--mono)">8–20 KB</text>
    </g>

    <g>
      <rect x="40" y="112" width="920" height="48" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="58" y="134" fill="#2d3142" font-size="12" font-weight="600">内置工具定义</text>
      <text x="200" y="134" fill="#4f5d75" font-size="10">数量固定，可按核心与延迟分层</text>
      <text x="920" y="134" text-anchor="end" fill="#7a8399" font-size="10" font-family="var(--mono)">10–40 KB</text>
    </g>

    <g>
      <rect x="40" y="168" width="920" height="48" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="58" y="190" fill="#2d3142" font-size="12" font-weight="600">MCP 工具定义</text>
      <text x="200" y="190" fill="#4f5d75" font-size="10">随接入服务增长，无上限</text>
      <text x="920" y="190" text-anchor="end" fill="#7a8399" font-size="10" font-family="var(--mono)">每个服务 5–25 KB</text>
    </g>

    <g>
      <rect x="40" y="224" width="920" height="48" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="58" y="246" fill="#2d3142" font-size="12" font-weight="600">Skill 目录</text>
      <text x="200" y="246" fill="#4f5d75" font-size="10">每条一句描述，可设长度上限</text>
      <text x="920" y="246" text-anchor="end" fill="#7a8399" font-size="10" font-family="var(--mono)">每条 0.1–0.2 KB</text>
    </g>

    <g>
      <rect x="40" y="280" width="920" height="44" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="58" y="302" fill="#2d3142" font-size="12" font-weight="600">历史消息</text>
      <text x="200" y="302" fill="#4f5d75" font-size="10">随任务推进增长，由压缩控制</text>
      <text x="920" y="302" text-anchor="end" fill="#7a8399" font-size="10" font-family="var(--mono)">可变</text>
    </g>

    <text x="40" y="336" fill="#7a8399" font-size="10">前三项是「工具与 Skill 规模账」的主体：它们不随任务推进变化，却每轮都要付。</text>
  </svg>
</body>
</html>
