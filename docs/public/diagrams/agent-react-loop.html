<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReAct 运行循环</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:auto; display:block; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-react-loop-title agent-react-loop-desc">
      <title id="agent-react-loop-title">ReAct 运行循环</title>
      <desc id="agent-react-loop-desc">图示 Agent 从目标出发，依次选择动作、执行工具、读取观察；需要继续时回到决策，达到完成条件后交付。</desc>
      <defs>
        <marker id="react-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="react-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="react-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1000" height="280" fill="#f5f5f5"/>

      <!-- connectors are drawn before nodes -->
      <path d="M 176,128 H 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#react-arrow)"/>
      <path d="M 352,128 H 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#react-arrow)"/>
      <path d="M 544,128 H 592" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#react-arrow-accent)"/>
      <path d="M 736,128 H 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#react-arrow)"/>
      <path d="M 824,176 V 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#react-arrow)"/>
      <path d="M 824,80 V 60 Q 824,52 816,52 H 288 Q 280,52 280,60 V 96" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#react-arrow-accent)"/>

      <rect x="524" y="28" width="48" height="16" rx="2" fill="#f5f5f5"/><text x="548" y="40" text-anchor="middle" fill="#eb6c36" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">继续</text>
      <rect x="840" y="184" width="48" height="16" rx="2" fill="#f5f5f5"/><text x="864" y="196" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">完成</text>

      <ellipse cx="104" cy="128" rx="72" ry="28" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
      <text x="104" y="134" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">用户目标</text>

      <rect x="208" y="96" width="144" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="280" y="122" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">理解与选择</text>
      <text x="280" y="144" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">LLM decision</text>

      <rect x="400" y="96" width="144" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="472" y="122" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">Action</text>
      <text x="472" y="144" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">tool + arguments</text>

      <rect x="592" y="96" width="144" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="664" y="122" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">Observation</text>
      <text x="664" y="144" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">result · evidence</text>

      <polygon points="824,80 880,128 824,176 768,128" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="824" y="124" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">需要继续？</text>
      <text x="824" y="142" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">next step</text>

      <ellipse cx="824" cy="244" rx="72" ry="28" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="824" y="250" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">交付结果</text>

    </svg>
  </main>
</body>
</html>
