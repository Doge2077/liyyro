<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent 上下文状态栏架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="status-architecture-title status-architecture-desc">
    <title id="status-architecture-title">Agent 上下文状态栏架构</title>
    <desc id="status-architecture-desc">事件日志和运行时状态经状态投影与验证生成模型可见快照，追加到上下文末尾，同时为终端界面提供独立展示。</desc>
    <rect width="1000" height="360" fill="#f5f5f5"/>
    <defs>
      <marker id="status-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="status-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      <marker id="status-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
    </defs>

    <path d="M 212 72 H 292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#status-arrow)"/>
    <path d="M 212 216 H 252 Q 260 216 260 208 V 104 Q 260 96 268 96 H 292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#status-arrow)"/>
    <path d="M 452 80 H 532" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#status-accent)"/>
    <path d="M 692 80 H 772" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#status-link)"/>
    <path d="M 612 112 V 216 H 532" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#status-arrow)"/>
    <path d="M 692 216 H 772" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#status-arrow)"/>

    <g>
      <rect x="40" y="48" width="172" height="64" rx="6" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
      <text x="126" y="72" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">事件日志</text>
      <text x="126" y="92" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">tool · task · user · error</text>
    </g>
    <g>
      <rect x="40" y="184" width="172" height="64" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
      <text x="126" y="208" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">环境观察</text>
      <text x="126" y="228" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">cwd · git · shell · time</text>
    </g>
    <g>
      <rect x="292" y="48" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="372" y="72" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">状态投影</text>
      <text x="372" y="92" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">derive · aggregate · diff</text>
    </g>
    <g>
      <rect x="532" y="48" width="160" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="612" y="72" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">模型状态快照</text>
      <text x="612" y="92" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">goal · progress · budget</text>
    </g>
    <g>
      <rect x="772" y="48" width="188" height="64" rx="6" fill="rgba(46,90,168,.05)" stroke="#2e5aa8"/>
      <text x="866" y="72" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">模型上下文末尾</text>
      <text x="866" y="92" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">user · developer · reminder</text>
    </g>
    <g>
      <rect x="532" y="184" width="160" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="612" y="208" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">完整性检查</text>
      <text x="612" y="228" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">source · freshness · trust</text>
    </g>
    <g>
      <rect x="772" y="184" width="188" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="866" y="208" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">终端状态线</text>
      <text x="866" y="228" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">model · tokens · cost · branch</text>
    </g>

    <line x1="40" y1="288" x2="960" y2="288" stroke="rgba(45,49,66,.12)"/>
    <text x="40" y="316" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".14em">SEPARATION</text>
    <text x="40" y="340" fill="#2d3142" font-size="13">终端状态线服务用户，模型状态快照服务下一次决策；两者共享数据源，但采用独立渲染和注入路径。</text>
  </svg>
</body>
</html>
