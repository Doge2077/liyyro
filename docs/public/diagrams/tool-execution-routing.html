<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工具调用的执行路径</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:auto; display:block; }
    .title { font-family:var(--sans); font-size:16px; font-weight:600; fill:var(--ink); }
    .sub { font-family:var(--mono); font-size:8px; fill:var(--soft); }
    .branch { font-family:var(--mono); font-size:8px; fill:var(--muted); }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tool-routing-title tool-routing-desc">
      <title id="tool-routing-title">工具调用的执行路径</title>
      <desc id="tool-routing-desc">模型返回工具调用后，Agent 框架解析参数并判断由本地应用执行还是由远端模型平台托管执行，随后把结果回填到下一轮上下文。</desc>
      <defs>
        <marker id="tool-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="tool-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="820" height="440" fill="#f5f5f5"/>

      <!-- connectors are drawn before nodes -->
      <path d="M410 56 V78" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tool-arrow)"/>
      <path d="M410 128 V144" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tool-arrow)"/>
      <path d="M532 188 H560" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#tool-arrow-accent)"/>
      <path d="M410 232 V252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tool-arrow)"/>
      <path d="M670 216 V316 Q670 324 662 324 H410" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#tool-arrow-accent)"/>
      <path d="M410 300 V324" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tool-arrow)"/>
      <path d="M410 328 V348" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tool-arrow)"/>
      <path d="M410 400 V420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tool-arrow)"/>

      <g class="branch" text-anchor="middle">
        <rect x="528" y="168" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="542" y="177">托管</text>
        <rect x="424" y="236" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="444" y="245">框架</text>
      </g>

      <g>
        <ellipse cx="410" cy="36" rx="150" ry="22" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
        <text x="410" y="41" text-anchor="middle" class="title">模型返回 tool call</text>
      </g>
      <g>
        <rect x="284" y="80" width="252" height="48" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="410" y="101" text-anchor="middle" class="title">Agent 框架解析与校验</text>
        <text x="410" y="117" text-anchor="middle" class="sub">arguments · schema · permission</text>
      </g>
      <g>
        <polygon points="410,144 532,188 410,232 288,188" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.3"/>
        <text x="410" y="185" text-anchor="middle" class="title">工具执行路径</text>
        <text x="410" y="201" text-anchor="middle" class="sub">framework · hosted</text>
      </g>
      <g>
        <rect x="560" y="164" width="220" height="52" rx="6" fill="#fff" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="670" y="187" text-anchor="middle" class="title">远端 LLM API 托管</text>
        <text x="670" y="204" text-anchor="middle" class="sub">web_search · file_search</text>
      </g>
      <g>
        <rect x="284" y="252" width="252" height="48" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="410" y="272" text-anchor="middle" class="title">Agent 框架分发工具</text>
        <text x="410" y="287" text-anchor="middle" class="sub">local · HTTP · MCP · other</text>
      </g>
      <circle cx="410" cy="324" r="4" fill="#2d3142"/>
      <g>
        <rect x="284" y="348" width="252" height="52" rx="7" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="410" y="371" text-anchor="middle" class="title">结果回填</text>
        <text x="410" y="388" text-anchor="middle" class="sub">tool result → next Context</text>
      </g>
      <g>
        <ellipse cx="410" cy="432" rx="82" ry="12" fill="#fff" stroke="#2d3142"/>
        <text x="410" y="436" text-anchor="middle" class="sub">继续生成 / 完成</text>
      </g>
    </svg>
  </main>
</body>
</html>
