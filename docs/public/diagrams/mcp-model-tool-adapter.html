<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP Tool 与模型工具的适配链路</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:auto; display:block; }
    .label { font-family:var(--mono); font-size:8px; fill:var(--muted); }
    .node-title { font-family:var(--sans); font-size:16px; font-weight:600; fill:var(--ink); }
    .node-sub { font-family:var(--mono); font-size:8px; fill:var(--soft); }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-adapter-title mcp-adapter-desc">
      <title id="mcp-adapter-title">MCP Tool 与模型工具的适配链路</title>
      <desc id="mcp-adapter-desc">MCP Server 通过 Client 向 Agent 框架提供能力，Agent 框架将能力转换为模型工具并发送请求；模型响应经框架和 MCP Client 回到 Server，结果再回填上下文。</desc>
      <defs>
        <marker id="mcp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="mcp-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="mcp-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1000" height="260" fill="#f5f5f5"/>

      <!-- connectors are drawn before nodes -->
      <path d="M220 88 H280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mcp-arrow)"/>
      <path d="M460 88 H520" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#mcp-arrow-accent)"/>
      <path d="M720 88 H780" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#mcp-arrow-accent)"/>
      <path d="M780 128 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mcp-arrow)"/>
      <path d="M520 128 H460" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#mcp-arrow-accent)"/>
      <path d="M280 128 H220" fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#mcp-arrow-accent)"/>
      <path d="M130 144 V188 H252 Q260 188 260 180 V116 H280" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#mcp-arrow-link)"/>
      <path d="M370 144 V220 H492 Q500 220 500 212 V116 H520" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#mcp-arrow-link)"/>

      <!-- arrow labels with paper masks -->
      <g class="label" text-anchor="middle">
        <rect x="222" y="68" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="250" y="77">tools/list</text>
        <rect x="444" y="68" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="77">MCP schema</text>
        <rect x="706" y="68" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="750" y="77">model request</text>
        <rect x="706" y="140" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="750" y="149">model response</text>
        <rect x="434" y="140" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="149">MCP tools/call</text>
        <rect x="214" y="140" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="250" y="149">MCP request</text>
        <rect x="156" y="164" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="194" y="173" fill="#2e5aa8">tool result</text>
        <rect x="392" y="196" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="205" fill="#2e5aa8">next Context</text>
      </g>

      <g>
        <rect x="40" y="72" width="180" height="72" rx="7" fill="#fff" stroke="#2d3142"/>
        <text x="130" y="101" text-anchor="middle" class="node-title">MCP Server</text>
        <text x="130" y="122" text-anchor="middle" class="node-sub">tool · resource · prompt</text>
      </g>
      <g>
        <rect x="280" y="72" width="180" height="72" rx="7" fill="#fff" stroke="#2d3142"/>
        <text x="370" y="101" text-anchor="middle" class="node-title">MCP Client</text>
        <text x="370" y="122" text-anchor="middle" class="node-sub">protocol adapter</text>
      </g>
      <g>
        <rect x="520" y="72" width="200" height="72" rx="8" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.3"/>
        <text x="620" y="101" text-anchor="middle" class="node-title">Agent 框架</text>
        <text x="620" y="122" text-anchor="middle" class="node-sub">schema · policy · tool loop</text>
        <text x="620" y="136" text-anchor="middle" class="node-sub">context · state · trace</text>
      </g>
      <g>
        <rect x="780" y="72" width="180" height="72" rx="7" fill="#fff" stroke="#2d3142"/>
        <text x="870" y="101" text-anchor="middle" class="node-title">LLM API</text>
        <text x="870" y="122" text-anchor="middle" class="node-sub">tool schema · tool call</text>
      </g>
    </svg>
  </main>
</body>
</html>
