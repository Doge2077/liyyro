<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三层学习信号与验证器的输出</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rs-title rs-desc">
    <title id="rs-title">三层学习信号与验证器的输出</title>
    <desc id="rs-desc">结果验证回答事情是否办成，过程验证回答是否以允许方式办成，质量验证回答是否让用户满意。三层依次需要更多判断，也更容易出错。</desc>
    <rect width="1000" height="360" fill="#f5f5f5"/>
    <defs>
      <marker id="rs-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">FROM HARD SIGNAL TO SOFT JUDGEMENT</text>

    <g>
      <rect x="40" y="60" width="290" height="96" fill="#ececec" stroke="#7a8399"/>
      <text x="58" y="84" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">LAYER 1</text>
      <text x="58" y="108" fill="#2d3142" font-size="14" font-weight="600">结果验证</text>
      <text x="58" y="130" fill="#4f5d75" font-size="10">测试、数据库状态、接口返回</text>
      <text x="58" y="148" fill="#7a8399" font-size="9">判定者：代码。最可靠，应优先建。</text>
    </g>

    <path d="M 330 108 H 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rs-ar)"/>

    <g>
      <rect x="372" y="60" width="290" height="96" fill="#fff" stroke="#2d3142"/>
      <text x="390" y="84" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">LAYER 2</text>
      <text x="390" y="108" fill="#2d3142" font-size="14" font-weight="600">过程验证</text>
      <text x="390" y="130" fill="#4f5d75" font-size="10">权限、规则、动作序列</text>
      <text x="390" y="148" fill="#7a8399" font-size="9">判定者：策略库。可代码化。</text>
    </g>

    <path d="M 662 108 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rs-ar)"/>

    <g>
      <rect x="704" y="60" width="256" height="96" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="722" y="84" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">LAYER 3</text>
      <text x="722" y="108" fill="#2d3142" font-size="14" font-weight="600">质量验证</text>
      <text x="722" y="130" fill="#4f5d75" font-size="10">表达、耐心、是否抓住重点</text>
      <text x="722" y="148" fill="#7a8399" font-size="9">判定者：量表 + 模型。最不确定。</text>
    </g>

    <g>
      <rect x="40" y="188" width="920" height="152" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="58" y="212" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">WHAT A USABLE VERDICT MUST CONTAIN</text>
      <text x="58" y="240" fill="#2d3142" font-size="12" font-weight="600">四项缺一不可</text>
      <text x="58" y="268" fill="#4f5d75" font-size="10">一、成功 / 部分成功 / 失败，三档而不是二分</text>
      <text x="58" y="290" fill="#4f5d75" font-size="10">二、逐维度结论，而不是一个总分</text>
      <text x="58" y="312" fill="#4f5d75" font-size="10">三、每条结论的证据位置（第几轮、哪次调用）</text>
      <text x="520" y="268" fill="#4f5d75" font-size="10">四、失败类型标签，供后续归因</text>
      <text x="520" y="290" fill="#7a8399" font-size="9">外加一条：证据不足时允许拒绝评分。</text>
      <text x="520" y="312" fill="#7a8399" font-size="9">低置信度案例不应进入学习集。</text>
    </g>

    <text x="40" y="358" fill="#7a8399" font-size="10">只给总分的验证器无法指导更新：它说不清该改知识、改提示词、改程序还是改参数。</text>
  </svg>
</body>
</html>
