<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>样本量与重复次数的两笔账</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ev-title ev-desc">
    <title id="ev-title">样本量与重复次数的两笔账</title>
    <desc id="ev-desc">任务数决定能否分辨两个版本的差异，重复次数决定单任务结论是否稳定。两者代价不同，不能互相替代。</desc>
    <rect width="1000" height="340" fill="#f5f5f5"/>
    <defs>
      <marker id="ev-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">TWO INDEPENDENT BUDGETS</text>

    <g>
      <rect x="40" y="56" width="440" height="120" fill="#fff" stroke="#2d3142"/>
      <text x="58" y="80" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">BUDGET 1 · TASKS</text>
      <text x="58" y="104" fill="#2d3142" font-size="13" font-weight="600">任务数决定分辨力</text>
      <text x="58" y="128" fill="#4f5d75" font-size="10">要分辨两个版本 5 个百分点的差异</text>
      <text x="58" y="150" fill="#4f5d75" font-size="10">取 p = 0.5、误差 5%、置信 95%</text>
      <text x="58" y="168" fill="#7a8399" font-size="9">需要约 384 个任务</text>
    </g>

    <g>
      <rect x="520" y="56" width="440" height="120" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="538" y="80" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">BUDGET 2 · TRIALS</text>
      <text x="538" y="104" fill="#2d3142" font-size="13" font-weight="600">重复次数决定稳定性</text>
      <text x="538" y="128" fill="#4f5d75" font-size="10">单个任务的结果有随机性</text>
      <text x="538" y="150" fill="#4f5d75" font-size="10">重复 3 次能看出波动范围</text>
      <text x="538" y="168" fill="#7a8399" font-size="9">重复 10 次才能稳定判断单任务</text>
    </g>

    <path d="M 260 176 V 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ev-ar)"/>
    <path d="M 740 176 V 208" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ev-ar)"/>

    <g>
      <rect x="40" y="208" width="920" height="100" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="58" y="232" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">THEY ARE NOT INTERCHANGEABLE</text>
      <text x="58" y="256" fill="#2d3142" font-size="12" font-weight="600">加任务数不能替代加重复次数，反之亦然</text>
      <text x="58" y="280" fill="#4f5d75" font-size="10">任务少但每任务跑 10 次：知道「这批任务上很稳」，但不知道「换一批任务还成立吗」。</text>
      <text x="58" y="300" fill="#7a8399" font-size="9">任务多但每任务跑 1 次：知道「覆盖广」，但单个任务的结论可能是运气。</text>
    </g>

    <text x="40" y="334" fill="#7a8399" font-size="10">实用配比：回归集任务多、重复少；关键任务重复多、任务少。</text>
  </svg>
</body>
</html>
