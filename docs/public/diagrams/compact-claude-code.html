<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Code 的分层压缩</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compact-claude-title compact-claude-desc">
    <title id="compact-claude-title">Claude Code 的分层压缩</title>
    <desc id="compact-claude-desc">五层压缩手段按成本从低到高排列，从服务端清理直到全量摘要，请求被拒时再做一次被动恢复。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="cc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="120" y="36" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".14em">COST INCREASES UPWARD</text>
    <text x="880" y="36" text-anchor="end" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".14em">LIGHTER FIRST</text>

    <path d="M 96 340 V 68" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cc-arrow)"/>
    <text x="72" y="208" text-anchor="middle" fill="#4f5d75" font-size="11">成本递增</text>

    <rect x="120" y="60" width="760" height="56" fill="#ececec" stroke="rgba(45,49,66,.12)"/>
    <rect x="120" y="116" width="760" height="56" fill="#fff" stroke="rgba(45,49,66,.12)"/>
    <rect x="120" y="172" width="760" height="56" fill="#ececec" stroke="rgba(45,49,66,.12)"/>
    <rect x="120" y="228" width="760" height="56" fill="#fff" stroke="rgba(45,49,66,.12)"/>
    <rect x="120" y="284" width="760" height="56" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>

    <text x="136" y="80" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">L1</text>
    <text x="196" y="94" fill="#2d3142" font-size="15" font-weight="600">服务端清理</text>
    <text x="864" y="94" text-anchor="end" fill="#4f5d75" font-size="10" font-family="var(--mono)">输入达 180k，保留 40k</text>

    <text x="136" y="136" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">L2</text>
    <text x="196" y="150" fill="#2d3142" font-size="15" font-weight="600">按消息删除</text>
    <text x="864" y="150" text-anchor="end" fill="#4f5d75" font-size="10" font-family="var(--mono)">30 条提示，模型标记</text>

    <text x="136" y="192" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">L3</text>
    <text x="196" y="206" fill="#2d3142" font-size="15" font-weight="600">旧结果清理</text>
    <text x="864" y="206" text-anchor="end" fill="#4f5d75" font-size="10" font-family="var(--mono)">保留 5 个，闲置 60 分钟</text>

    <text x="136" y="248" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">L4</text>
    <text x="196" y="262" fill="#2d3142" font-size="15" font-weight="600">会话记忆替代</text>
    <text x="864" y="262" text-anchor="end" fill="#4f5d75" font-size="10" font-family="var(--mono)">保留 10k–40k，免摘要调用</text>

    <text x="136" y="304" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">L5</text>
    <text x="196" y="318" fill="#2d3142" font-size="15" font-weight="600">全量摘要</text>
    <text x="864" y="318" text-anchor="end" fill="#4f5d75" font-size="10" font-family="var(--mono)">预留 20k，缓冲 13k / 30k / 50k</text>

    <text x="120" y="374" fill="#7a8399" font-size="10">请求被拒后缩减最老轮次并重试一次；预测式压缩在阈值前再提前 15k。</text>
  </svg>
</body>
</html>
