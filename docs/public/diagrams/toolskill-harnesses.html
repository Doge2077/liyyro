<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四家的工具与 Skill 注册与加载</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="thc-title thc-desc">
    <title id="thc-title">四家的工具与 Skill 注册与加载</title>
    <desc id="thc-desc">四家在注册表形态、作用域分层、发现优先级、延迟加载、权限模型、结果截断六项上各有取舍。共同点是没有一家把所有工具一次性常驻。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="th-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="36" y="32" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">SIX DIMENSIONS, FOUR IMPLEMENTATIONS</text>

    <g>
      <rect x="36" y="52" width="230" height="44" fill="#ececec" stroke="#7a8399"/>
      <text x="151" y="79" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">注册表与分层</text>
    </g>
    <g>
      <rect x="278" y="52" width="230" height="44" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="393" y="79" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">延迟与按需</text>
    </g>
    <g>
      <rect x="520" y="52" width="230" height="44" fill="#fff" stroke="#2d3142"/>
      <text x="635" y="79" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">权限与截断</text>
    </g>
    <g>
      <rect x="762" y="52" width="202" height="44" fill="#fff" stroke="#2d3142"/>
      <text x="863" y="79" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">Skill 加载</text>
    </g>

    <g>
      <rect x="36" y="108" width="928" height="64" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="132" fill="#2d3142" font-size="12" font-weight="600">Claude Code</text>
      <text x="54" y="152" fill="#4f5d75" font-size="10">核心工具白名单常驻</text>
      <text x="278" y="132" fill="#4f5d75" font-size="10">非核心与全部 MCP 进延迟集合</text>
      <text x="278" y="152" fill="#7a8399" font-size="9">搜索四形态：精确名 · 多选 · 取描述 · 关键词</text>
      <text x="520" y="132" fill="#4f5d75" font-size="10">工具层权限 + MCP 输出上限</text>
      <text x="520" y="152" fill="#7a8399" font-size="9">25,000 Token</text>
      <text x="762" y="132" fill="#4f5d75" font-size="10">TF-IDF 排序检索</text>
      <text x="762" y="152" fill="#7a8399" font-size="9">目录常驻 + 发现工具</text>
    </g>

    <g>
      <rect x="36" y="180" width="928" height="64" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="204" fill="#2d3142" font-size="12" font-weight="600">Codex</text>
      <text x="54" y="224" fill="#4f5d75" font-size="10">可加载工具与常驻工具分开</text>
      <text x="278" y="204" fill="#4f5d75" font-size="10">独立搜索工具，默认返回 8 条</text>
      <text x="278" y="224" fill="#7a8399" font-size="9">来源描述总预算 512 KB</text>
      <text x="520" y="204" fill="#4f5d75" font-size="10">工具策略 + 命名空间过滤</text>
      <text x="520" y="224" fill="#7a8399" font-size="9">输出截断 + 大结果外置</text>
      <text x="762" y="204" fill="#4f5d75" font-size="10">技能目录 + 提及与调用</text>
      <text x="762" y="224" fill="#7a8399" font-size="9">frontmatter 解析</text>
    </g>

    <g>
      <rect x="36" y="252" width="928" height="64" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="276" fill="#2d3142" font-size="12" font-weight="600">OpenCode</text>
      <text x="54" y="296" fill="#4f5d75" font-size="10">叶子工具各自声明权限动作</text>
      <text x="278" y="276" fill="#4f5d75" font-size="10">能力按位置装配</text>
      <text x="278" y="296" fill="#7a8399" font-size="9">无统一的延迟工具池</text>
      <text x="520" y="276" fill="#4f5d75" font-size="10">权限动作 + 结果截断</text>
      <text x="520" y="296" fill="#7a8399" font-size="9">2,000 行 / 50 KiB</text>
      <text x="762" y="276" fill="#4f5d75" font-size="10">磁盘发现 + 监视</text>
      <text x="762" y="296" fill="#7a8399" font-size="9">并发受限的扫描</text>
    </g>

    <g>
      <rect x="36" y="324" width="928" height="64" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="348" fill="#2d3142" font-size="12" font-weight="600">DeepSeek Harness</text>
      <text x="54" y="368" fill="#4f5d75" font-size="10">宿主层 + scope 层合并</text>
      <text x="278" y="348" fill="#4f5d75" font-size="10">目录渲染 + 加载工具</text>
      <text x="278" y="368" fill="#7a8399" font-size="9">描述长度上限</text>
      <text x="520" y="348" fill="#4f5d75" font-size="10">规范输出声明 + 执行守卫</text>
      <text x="520" y="368" fill="#7a8399" font-size="9">超时与取消信号</text>
      <text x="762" y="348" fill="#4f5d75" font-size="10">注册表分层 + 单层内 rank</text>
      <text x="762" y="368" fill="#7a8399" font-size="9">仅扫根目录一层</text>
    </g>

    <text x="36" y="400" fill="#7a8399" font-size="10">四家共同点：没有一家把所有工具一次性常驻。</text>
  </svg>
</body>
</html>
