<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode 的检查点数据流</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="compact-opencode-title compact-opencode-desc">
    <title id="compact-opencode-title">OpenCode 的检查点数据流</title>
    <desc id="compact-opencode-desc">对话历史拆成较早历史和最近内容，较早历史交给摘要模型生成检查点，最近内容保留原文，两者合并后进入下一轮请求。</desc>
    <rect width="1000" height="360" fill="#f5f5f5"/>
    <defs>
      <marker id="oc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="oc-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <path d="M 160 162 H 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oc-arrow)"/>
    <path d="M 252 130 V 94 Q 252 86 260 86 H 350" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oc-arrow)"/>
    <path d="M 252 194 V 222 Q 252 230 260 230 H 350" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oc-arrow)"/>
    <path d="M 500 86 H 530" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oc-arrow)"/>
    <path d="M 680 86 H 700 Q 708 86 708 94 V 140 Q 708 148 716 148 H 720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oc-arrow)"/>
    <path d="M 500 230 H 660 Q 668 230 668 222 V 180 H 720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oc-arrow)"/>
    <path d="M 835 204 V 248" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#oc-accent)"/>

    <g>
      <rect x="30" y="130" width="130" height="64" rx="6" fill="#ececec" stroke="#7a8399"/>
      <text x="95" y="158" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">对话历史</text>
      <text x="95" y="178" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">messages · results</text>
    </g>
    <g>
      <rect x="192" y="130" width="120" height="64" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="252" y="158" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">拆分历史</text>
      <text x="252" y="178" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">older · recent</text>
    </g>
    <g>
      <rect x="350" y="56" width="150" height="60" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="425" y="82" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">较早历史</text>
      <text x="425" y="102" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">交给摘要模型</text>
    </g>
    <g>
      <rect x="350" y="200" width="150" height="60" rx="6" fill="#ececec" stroke="#7a8399"/>
      <text x="425" y="226" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">最近内容</text>
      <text x="425" y="246" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">保留 15k 原文</text>
    </g>
    <g>
      <rect x="530" y="56" width="150" height="60" rx="6" fill="rgba(46,90,168,.05)" stroke="#2e5aa8"/>
      <text x="605" y="82" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">摘要模型</text>
      <text x="605" y="102" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">七个章节</text>
    </g>
    <g>
      <rect x="720" y="116" width="230" height="88" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="835" y="146" text-anchor="middle" fill="#2d3142" font-size="15" font-weight="600">检查点消息</text>
      <text x="835" y="170" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="var(--mono)">summary + recent context</text>
      <text x="835" y="190" text-anchor="middle" fill="#7a8399" font-size="9" font-family="var(--mono)">上一份检查点合并进来</text>
    </g>
    <g>
      <rect x="720" y="248" width="230" height="56" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="835" y="272" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">下一轮请求</text>
      <text x="835" y="290" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">从检查点继续</text>
    </g>
    <g>
      <rect x="350" y="284" width="340" height="52" rx="6" fill="none" stroke="#7a8399" stroke-dasharray="4,3"/>
      <text x="366" y="306" fill="#4f5d75" font-size="10">服务商原生检查点</text>
      <text x="366" y="324" fill="#7a8399" font-size="9">同一提供方内重放，否则退回文本摘要</text>
    </g>
  </svg>
</body>
</html>
