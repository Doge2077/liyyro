<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex 的两阶段记忆管线</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcx-title mcx-desc">
    <title id="mcx-title">Codex 的两阶段记忆管线</title>
    <desc id="mcx-desc">阶段一按轨迹逐条抽取，写入状态库；阶段二抢单锁后挑输入、同步产物、生成工作区差异，再交给离线整合子代理产出摘要与手册。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="cx-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="cx-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="48" y="44" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">PHASE 1</text>
    <text x="48" y="212" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">PHASE 2</text>

    <path d="M 218 118 H 258" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cx-ar)"/>
    <path d="M 418 118 H 458" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cx-ar)"/>
    <path d="M 618 118 H 658" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cx-ar)"/>

    <g>
      <rect x="48" y="86" width="170" height="64" fill="#ececec" stroke="#7a8399"/>
      <text x="133" y="114" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">轨迹筛选</text>
      <text x="133" y="134" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">≤10d · ≥6h idle</text>
    </g>
    <g>
      <rect x="258" y="86" width="160" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="338" y="114" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">逐条抽取</text>
      <text x="338" y="134" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">max 2 / startup</text>
    </g>
    <g>
      <rect x="458" y="86" width="160" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="538" y="114" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">状态库</text>
      <text x="538" y="134" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">usage · lease · retry</text>
    </g>
    <g>
      <rect x="658" y="86" width="170" height="64" fill="#ececec" stroke="#7a8399"/>
      <text x="743" y="114" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">无人可写</text>
      <text x="743" y="134" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">no-op 允许且优先</text>
    </g>

    <path d="M 538 150 V 196 H 218" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cx-ar)"/>

    <path d="M 218 252 H 258" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cx-ar)"/>
    <path d="M 418 252 H 458" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cx-ar)"/>
    <path d="M 618 252 H 658" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#cx-ac)"/>

    <g>
      <rect x="48" y="220" width="170" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="133" y="248" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">挑选输入</text>
      <text x="133" y="268" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">≤256 · ≤30d unused</text>
    </g>
    <g>
      <rect x="258" y="220" width="160" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="338" y="248" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">同步产物</text>
      <text x="338" y="268" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">git baseline</text>
    </g>
    <g>
      <rect x="458" y="220" width="160" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="538" y="248" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">工作区差异</text>
      <text x="538" y="268" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">add / modify / delete</text>
    </g>
    <g>
      <rect x="658" y="212" width="170" height="80" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="743" y="238" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600">整合子代理</text>
      <text x="743" y="258" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">no net · local write</text>
      <text x="743" y="276" text-anchor="middle" fill="#7a8399" font-size="9" font-family="var(--mono)">no collab</text>
    </g>

    <path d="M 828 252 H 868" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cx-ar)"/>
    <g>
      <rect x="868" y="212" width="100" height="80" fill="#eaf0fa" stroke="#2e5aa8"/>
      <text x="918" y="244" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">摘要</text>
      <text x="918" y="264" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">≤10 KB</text>
    </g>

    <line x1="48" y1="318" x2="968" y2="318" stroke="rgba(45,49,66,.12)"/>
    <text x="48" y="344" fill="#4f5d75" font-size="11">摘要首行固定为版本标记，模式不符就整份重写；读取侧以开发者指令注入，单片段截断在 8,900 字节。</text>
    <text x="48" y="368" fill="#7a8399" font-size="10">两阶段分离的理由：抽取要覆盖大量轨迹并并行，整合必须串行，否则同一份产物会被并发改写。</text>
  </svg>
</body>
</html>
