<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent 系统分层</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:auto; display:block; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-system-architecture-title agent-system-architecture-desc">
      <title id="agent-system-architecture-title">Agent 系统的分层与执行边界</title>
      <desc id="agent-system-architecture-desc">图示用户目标如何进入 Runtime，由 LLM 基于 Context 提出工具动作，经校验后访问外部环境并把结果写回状态。</desc>
      <defs>
        <marker id="agent-arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="agent-arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
        <marker id="agent-arch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1000" height="420" fill="#f5f5f5"/>

      <rect x="32" y="20" width="936" height="68" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
      <rect x="32" y="104" width="936" height="196" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
      <rect x="32" y="316" width="936" height="64" rx="8" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.12)"/>
      <rect x="48" y="24" width="80" height="16" rx="2" fill="#f5f5f5"/><text x="88" y="36" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">INPUT</text>
      <rect x="48" y="108" width="112" height="16" rx="2" fill="#f5f5f5"/><text x="104" y="120" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">AGENT RUNTIME</text>
      <rect x="48" y="320" width="104" height="16" rx="2" fill="#f5f5f5"/><text x="100" y="332" text-anchor="middle" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".14em">ENVIRONMENT</text>

      <!-- connectors are drawn before nodes -->
      <path d="M 252,54 H 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-arch-arrow)"/>
      <path d="M 456,92 V 132" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-arch-arrow)"/>
      <path d="M 576,160 H 660" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#agent-arch-arrow-accent)"/>
      <path d="M 780,192 V 216 H 576" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#agent-arch-arrow-accent)"/>
      <path d="M 456,280 V 332" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#agent-arch-arrow-link)"/>
      <path d="M 576,350 H 660" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#agent-arch-arrow-link)"/>
      <path d="M 780,332 V 280 H 576" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#agent-arch-arrow)"/>

      <g>
        <rect x="72" y="40" width="180" height="40" rx="6" fill="rgba(79,93,117,.10)" stroke="#7a8399"/>
        <text x="162" y="58" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">用户目标</text>
        <text x="162" y="72" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">goal · constraints</text>
      </g>
      <g>
        <rect x="336" y="36" width="240" height="56" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="352" y="44" width="56" height="16" rx="2" fill="rgba(45,49,66,.08)" stroke="#4f5d75" stroke-width=".8"/>
        <text x="380" y="56" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">RUNTIME</text>
        <text x="456" y="72" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">任务控制器</text>
        <text x="456" y="84" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">state · policy · budget</text>
      </g>
      <g>
        <rect x="336" y="132" width="240" height="56" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="456" y="155" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">LLM</text>
        <text x="456" y="174" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">understand · decide · compose</text>
      </g>
      <g>
        <rect x="660" y="132" width="240" height="60" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="780" y="156" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">Tools</text>
        <text x="780" y="176" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">search · read · write · call</text>
      </g>
      <g>
        <rect x="336" y="224" width="240" height="56" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/>
        <text x="456" y="247" text-anchor="middle" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">Context &amp; Trace</text>
        <text x="456" y="266" text-anchor="middle" fill="#4f5d75" font-size="10" font-family="'Geist Mono',monospace">messages · evidence · history</text>
      </g>
      <g>
        <rect x="336" y="332" width="240" height="36" rx="6" fill="#fff" stroke="#2d3142"/>
        <text x="456" y="348" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">检索与文档系统</text>
        <text x="456" y="360" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">web · files · calendar</text>
      </g>
      <g>
        <rect x="660" y="332" width="240" height="36" rx="6" fill="rgba(46,90,168,.05)" stroke="#2e5aa8"/>
        <text x="780" y="348" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif">协作与业务系统</text>
        <text x="780" y="360" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">people · tasks · APIs</text>
      </g>
    </svg>
  </main>
</body>
</html>
