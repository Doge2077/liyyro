<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>缓存友好的上下文布局</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cache-layout-title cache-layout-desc">
    <title id="cache-layout-title">缓存友好的上下文布局</title>
    <desc id="cache-layout-desc">分层展示稳定规则、能力说明、任务轨迹和动态请求在模型输入中的排列方式。</desc>
    <rect width="1000" height="320" fill="#f5f5f5"/>
    <text x="64" y="28" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".14em">STABLE PREFIX</text>
    <text x="936" y="28" text-anchor="end" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".14em">MORE VARIABLE ↓</text>

    <rect x="64" y="44" width="872" height="60" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <rect x="64" y="104" width="872" height="60" fill="#fff" stroke="rgba(45,49,66,.12)"/>
    <rect x="64" y="164" width="872" height="60" fill="rgba(45,49,66,.05)" stroke="rgba(45,49,66,.12)"/>
    <rect x="64" y="224" width="872" height="60" rx="6" fill="rgba(46,90,168,.05)" stroke="#2e5aa8"/>

    <text x="88" y="68" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".12em">GLOBAL RULES</text>
    <text x="88" y="92" fill="#2d3142" font-size="16" font-weight="600">系统规则与固定流程</text>
    <text x="456" y="84" fill="#4f5d75" font-size="10" font-family="var(--mono)">identity · policy · completion criteria</text>

    <text x="88" y="128" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".12em">CAPABILITY CATALOG</text>
    <text x="88" y="152" fill="#2d3142" font-size="16" font-weight="600">工具定义、固定示例、Skill 目录</text>
    <text x="456" y="144" fill="#4f5d75" font-size="10" font-family="var(--mono)">schemas · examples · routing metadata</text>

    <text x="88" y="188" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".12em">TASK TRAJECTORY</text>
    <text x="88" y="212" fill="#2d3142" font-size="16" font-weight="600">用户输入、模型动作、工具结果</text>
    <text x="456" y="204" fill="#4f5d75" font-size="10" font-family="var(--mono)">append · summarize · archive</text>

    <text x="88" y="248" fill="#2e5aa8" font-size="8" font-family="var(--mono)" letter-spacing=".12em">LATEST TURN</text>
    <text x="88" y="272" fill="#2d3142" font-size="16" font-weight="600">当前状态、本轮请求、最新观察</text>
    <text x="456" y="264" fill="#4f5d75" font-size="10" font-family="var(--mono)">runtime context · user turn · observation</text>
  </svg>
</body>
</html>
