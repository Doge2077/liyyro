<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搜索结果体积的四层控制</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ret-bud-title ret-bud-desc">
    <title id="ret-bud-title">搜索结果体积的四层控制</title>
    <desc id="ret-bud-desc">从原始输出到进入模型上下文要过四道关卡：原始输出上限、单次返回条数、单条预览长度、进入上下文后的旧结果清理。</desc>
    <rect width="1000" height="360" fill="#f5f5f5"/>
    <defs>
      <marker id="rb-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="rb-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="44" y="40" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">FOUR GATES</text>

    <path d="M 220 110 H 256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rb-ar)"/>
    <path d="M 436 110 H 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rb-ar)"/>
    <path d="M 652 110 H 688" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rb-ar)"/>
    <path d="M 868 110 V 154" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#rb-ac)"/>

    <g>
      <rect x="44" y="78" width="176" height="64" fill="#ececec" stroke="#7a8399"/>
      <text x="132" y="102" text-anchor="middle" fill="#2d3142" font-size="13" font-weight="600">原始输出</text>
      <text x="132" y="122" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">rg stdout</text>
    </g>
    <g>
      <rect x="256" y="78" width="180" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="346" y="102" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">第一关</text>
      <text x="346" y="122" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">上限 20 MB · 30 s</text>
    </g>
    <g>
      <rect x="472" y="78" width="180" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="562" y="102" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">第二关</text>
      <text x="562" y="122" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">100 路径 · 250 匹配</text>
    </g>
    <g>
      <rect x="688" y="78" width="180" height="64" fill="#fff" stroke="#2d3142"/>
      <text x="778" y="102" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">第三关</text>
      <text x="778" y="122" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">单行预览 2,000 B</text>
    </g>

    <g>
      <rect x="620" y="154" width="336" height="88" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="644" y="180" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">GATE 4</text>
      <text x="644" y="204" fill="#2d3142" font-size="13" font-weight="600">进入上下文之后的二次控制</text>
      <text x="644" y="226" fill="#4f5d75" font-size="10">旧工具结果清理 · 结果修剪 · 折叠为引用</text>
    </g>

    <path d="M 346 142 V 200 H 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rb-ar)"/>
    <path d="M 562 142 V 200 H 460" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rb-ar)"/>

    <g>
      <rect x="44" y="200" width="200" height="72" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="144" y="226" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">超上限 → 外置</text>
      <text x="144" y="248" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">full file + locator</text>
      <text x="144" y="264" text-anchor="middle" fill="#7a8399" font-size="9">内联页面保留</text>
    </g>
    <g>
      <rect x="260" y="200" width="200" height="72" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="360" y="226" text-anchor="middle" fill="#2d3142" font-size="12" font-weight="600">截断显式标注</text>
      <text x="360" y="248" text-anchor="middle" fill="#4f5d75" font-size="9" font-family="var(--mono)">"showing first N"</text>
      <text x="360" y="264" text-anchor="middle" fill="#7a8399" font-size="9">提示换更精确的模式</text>
    </g>

    <line x1="44" y1="304" x2="956" y2="304" stroke="rgba(45,49,66,.12)"/>
    <text x="44" y="328" fill="#4f5d75" font-size="11">四道关卡分别对应四种失败：命令本身过载、结果过多、单行过长、历史累积占用窗口。</text>
    <text x="44" y="350" fill="#7a8399" font-size="10">只做其中一两道的系统，会在长任务里被剩下那几道拖住。</text>
  </svg>
</body>
</html>
