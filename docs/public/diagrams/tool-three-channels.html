<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工具的三条信息通道与失真点</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttc-title ttc-desc">
    <title id="ttc-title">工具的三条信息通道与失真点</title>
    <desc id="ttc-desc">定义通道决定模型是否选中这个工具，调用通道决定参数是否正确，结果通道决定模型能否据以决策。三条通道各有独立的失真方式。</desc>
    <rect width="1000" height="380" fill="#f5f5f5"/>
    <defs>
      <marker id="tc2-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
      <marker id="tc2-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <text x="36" y="32" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">THREE CHANNELS, THREE FAILURES</text>

    <g>
      <rect x="36" y="56" width="928" height="44" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="84" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">TOOL DEFINITION · EVERY TURN · FIXED COST</text>
    </g>

    <path d="M 160 100 V 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tc2-ar)"/>
    <path d="M 500 100 V 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tc2-ar)"/>
    <path d="M 840 100 V 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tc2-ar)"/>

    <g>
      <rect x="36" y="136" width="250" height="128" fill="#fff" stroke="#2d3142"/>
      <text x="54" y="160" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">CHANNEL 1 · SELECT</text>
      <text x="54" y="184" fill="#2d3142" font-size="13" font-weight="600">定义通道</text>
      <text x="54" y="208" fill="#4f5d75" font-size="10">模型是否选中这个工具</text>
      <text x="54" y="230" fill="#7a8399" font-size="9">失真：同名不同义、描述模糊</text>
      <text x="54" y="250" fill="#7a8399" font-size="9">代价：每轮固定占用</text>
    </g>

    <g>
      <rect x="375" y="136" width="250" height="128" fill="#fff" stroke="#2d3142"/>
      <text x="393" y="160" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">CHANNEL 2 · FILL</text>
      <text x="393" y="184" fill="#2d3142" font-size="13" font-weight="600">调用通道</text>
      <text x="393" y="208" fill="#4f5d75" font-size="10">参数填得对不对</text>
      <text x="393" y="230" fill="#7a8399" font-size="9">失真：自由文本、必填过多</text>
      <text x="393" y="250" fill="#7a8399" font-size="9">代价：一次失败往返</text>
    </g>

    <g>
      <rect x="715" y="136" width="249" height="128" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="733" y="160" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">CHANNEL 3 · DECIDE</text>
      <text x="733" y="184" fill="#2d3142" font-size="13" font-weight="600">结果通道</text>
      <text x="733" y="208" fill="#4f5d75" font-size="10">模型能否据以决策</text>
      <text x="733" y="230" fill="#7a8399" font-size="9">失真：长字符串、隐式截断</text>
      <text x="733" y="250" fill="#7a8399" font-size="9">代价：错误决策，最贵</text>
    </g>

    <path d="M 161 264 V 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tc2-ar)"/>
    <path d="M 500 264 V 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tc2-ar)"/>
    <path d="M 839 264 V 296" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#tc2-ac)"/>

    <g>
      <rect x="36" y="296" width="928" height="64" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="54" y="320" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">CHANNELS COUPLE</text>
      <text x="54" y="344" fill="#4f5d75" font-size="10">延迟加载省了通道一的成本，却在通道二上多了一次「先搜再调」的往返；结果截断省了通道三的体积，却可能让模型把不完整当完整。</text>
    </g>

    <text x="36" y="374" fill="#7a8399" font-size="10">三条通道的设计目标一致：在固定的上下文预算下，让失真最小。</text>
  </svg>
</body>
</html>
