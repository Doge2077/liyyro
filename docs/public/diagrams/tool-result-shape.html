<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工具结果的四段式结构</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trs-title trs-desc">
    <title id="trs-title">工具结果的四段式结构</title>
    <desc id="trs-desc">结果分状态、摘要、结构化数据与原始产物四段。状态决定后续动作，摘要是默认读取项，结构化数据供精确判断，原始产物用于追溯。</desc>
    <rect width="1000" height="360" fill="#f5f5f5"/>
    <defs>
      <marker id="ts-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">FOUR SEGMENTS, FOUR READERS</text>

    <path d="M 40 120 H 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ts-ar)"/>

    <g>
      <rect x="96" y="60" width="200" height="120" fill="#ececec" stroke="#7a8399"/>
      <text x="114" y="84" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">SEGMENT 1</text>
      <text x="114" y="108" fill="#2d3142" font-size="13" font-weight="600">状态</text>
      <text x="114" y="130" fill="#4f5d75" font-size="10">成功 · 失败 · 部分</text>
      <text x="114" y="150" fill="#4f5d75" font-size="10">可重试 · 需改参</text>
      <text x="114" y="170" fill="#7a8399" font-size="9">决定下一步动作</text>
    </g>

    <path d="M 296 120 H 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ts-ar)"/>

    <g>
      <rect x="332" y="60" width="200" height="120" fill="rgba(235,108,36,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="350" y="84" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">SEGMENT 2</text>
      <text x="350" y="108" fill="#2d3142" font-size="13" font-weight="600">摘要</text>
      <text x="350" y="130" fill="#4f5d75" font-size="10">一两句结论</text>
      <text x="350" y="150" fill="#4f5d75" font-size="10">带数量与来源</text>
      <text x="350" y="170" fill="#7a8399" font-size="9">模型默认读这段</text>
    </g>

    <path d="M 532 120 H 568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ts-ar)"/>

    <g>
      <rect x="568" y="60" width="200" height="120" fill="#fff" stroke="#2d3142"/>
      <text x="586" y="84" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">SEGMENT 3</text>
      <text x="586" y="108" fill="#2d3142" font-size="13" font-weight="600">结构化数据</text>
      <text x="586" y="130" fill="#4f5d75" font-size="10">条目、字段、计数</text>
      <text x="586" y="150" fill="#4f5d75" font-size="10">可被条件判断</text>
      <text x="586" y="170" fill="#7a8399" font-size="9">需要精确时读</text>
    </g>

    <path d="M 768 120 H 804" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ts-ar)"/>

    <g>
      <rect x="804" y="60" width="156" height="120" fill="#fff" stroke="#2d3142"/>
      <text x="822" y="84" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">SEGMENT 4</text>
      <text x="822" y="108" fill="#2d3142" font-size="13" font-weight="600">原始产物</text>
      <text x="822" y="130" fill="#4f5d75" font-size="10">文件路径</text>
      <text x="822" y="150" fill="#4f5d75" font-size="10">可重新读取</text>
      <text x="822" y="170" fill="#7a8399" font-size="9">出错后追溯</text>
    </g>

    <g>
      <rect x="40" y="220" width="920" height="100" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="58" y="244" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">THE FAILURE THIS PREVENTS</text>
      <text x="58" y="268" fill="#2d3142" font-size="12" font-weight="600">只返回一大段字符串时，模型必须自己从中提取状态与结论</text>
      <text x="58" y="290" fill="#4f5d75" font-size="10">它可能把「部分成功」读成「成功」，也可能在截断后仍以为拿到了全部。</text>
      <text x="58" y="308" fill="#7a8399" font-size="9">四段式把「状态」与「内容」分开，让状态判断不依赖模型解析文本。</text>
    </g>

    <text x="40" y="348" fill="#7a8399" font-size="10">截断必须显式：返回里要写明「还有多少未展示」，否则模型会把不完整当完整。</text>
  </svg>
</body>
</html>
