<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识组织的三种方式与各自的适用查询</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rag-org-title rag-org-desc">
    <title id="rag-org-title">知识组织的三种方式与各自的适用查询</title>
    <desc id="rag-org-desc">树状抽象适合从概念钻进细节，实体关系图适合多跳与消歧，文件系统适合人读、可 diff、可回滚。三者索引期成本依次降低，但都需要额外维护。</desc>
    <rect width="1000" height="400" fill="#f5f5f5"/>
    <defs>
      <marker id="ro-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="44" y="40" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">THREE ORGANIZING MODES</text>

    <g>
      <rect x="44" y="66" width="290" height="150" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="62" y="90" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">TREE</text>
      <text x="62" y="114" fill="#2d3142" font-size="15" font-weight="600">递归抽象</text>
      <text x="62" y="138" fill="#4f5d75" font-size="10">叶子聚类后生成父节点摘要</text>
      <text x="62" y="158" fill="#4f5d75" font-size="10">从宏观概念向下钻取细节</text>
      <text x="62" y="182" fill="#7a8399" font-size="9" font-family="var(--mono)">索引期：多次摘要调用</text>
      <text x="62" y="200" fill="#7a8399" font-size="9" font-family="var(--mono)">适用：整体架构到具体指令</text>
    </g>

    <g>
      <rect x="354" y="66" width="290" height="150" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="372" y="90" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">GRAPH</text>
      <text x="372" y="114" fill="#2d3142" font-size="15" font-weight="600">实体与关系</text>
      <text x="372" y="138" fill="#4f5d75" font-size="10">三元组构成知识网络</text>
      <text x="372" y="158" fill="#4f5d75" font-size="10">多跳遍历与同名实体消歧</text>
      <text x="372" y="182" fill="#7a8399" font-size="9" font-family="var(--mono)">索引期：抽取 + 社区摘要</text>
      <text x="372" y="200" fill="#7a8399" font-size="9" font-family="var(--mono)">代价：三元组丢失条件与时间</text>
    </g>

    <g>
      <rect x="664" y="66" width="292" height="150" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="682" y="90" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">FILESYSTEM</text>
      <text x="682" y="114" fill="#2d3142" font-size="15" font-weight="600">目录与文件</text>
      <text x="682" y="138" fill="#4f5d75" font-size="10">目录表达从属，文件名表达实体</text>
      <text x="682" y="158" fill="#4f5d75" font-size="10">人可读、可 diff、可回滚</text>
      <text x="682" y="182" fill="#7a8399" font-size="9" font-family="var(--mono)">索引期：几乎为零</text>
      <text x="682" y="200" fill="#7a8399" font-size="9" font-family="var(--mono)">前提：条目之间必须有链接</text>
    </g>

    <path d="M 189 216 V 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ro-ar)"/>
    <path d="M 499 216 V 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ro-ar)"/>
    <path d="M 810 216 V 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ro-ar)"/>

    <g>
      <rect x="44" y="248" width="912" height="72" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="62" y="272" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">SHARED PRECONDITION</text>
      <text x="62" y="296" fill="#2d3142" font-size="13" font-weight="600">三种方式都要在索引期投入：把原始材料提炼成可检索的单元，而不是原样平铺</text>
      <text x="62" y="314" fill="#4f5d75" font-size="10">只做向量化的原始片段，回答不了“比例是多少”这类需要整体统计的问题。</text>
    </g>

    <text x="44" y="352" fill="#7a8399" font-size="10">选择依据是查询形状：需要钻进细节用树，需要关系与消歧用图，需要人工维护与版本控制用文件系统。</text>
    <text x="44" y="376" fill="#7a8399" font-size="10">三者可以叠用，代价是索引期多次模型调用，以及维护两套以上的一致性。</text>
  </svg>
</body>
</html>
