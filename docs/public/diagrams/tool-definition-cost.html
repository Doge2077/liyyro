<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工具定义的成本结构</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8; --sans:'Geist','Noto Sans SC',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--paper); }
    body { color:var(--ink); font-family:var(--sans); }
    svg { width:100%; height:100%; display:block; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tdc-title tdc-desc">
    <title id="tdc-title">工具定义的成本结构</title>
    <desc id="tdc-desc">每个工具的定义占用固定上下文，名字与参数占小部分，描述占大部分。工具数增长时定义总量线性上升，而误选率非线性上升。</desc>
    <rect width="1000" height="340" fill="#f5f5f5"/>
    <defs>
      <marker id="td-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <text x="40" y="34" fill="#7a8399" font-size="9" font-family="var(--mono)" letter-spacing=".16em">PER-DEFINITION COST</text>

    <g>
      <rect x="40" y="56" width="440" height="64" fill="#ececec" stroke="#7a8399"/>
      <text x="58" y="78" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">NAME + SCHEMA</text>
      <text x="58" y="102" fill="#2d3142" font-size="13" font-weight="600">名字与参数结构</text>
      <text x="270" y="102" fill="#4f5d75" font-size="10" font-family="var(--mono)">约 80–150 字节</text>
    </g>
    <g>
      <rect x="40" y="128" width="440" height="88" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="58" y="150" fill="#eb6c36" font-size="8" font-family="var(--mono)" letter-spacing=".1em">DESCRIPTION</text>
      <text x="58" y="174" fill="#2d3142" font-size="13" font-weight="600">描述、使用场景、返回形态</text>
      <text x="270" y="174" fill="#4f5d75" font-size="10" font-family="var(--mono)">约 200–650 字节</text>
      <text x="58" y="198" fill="#4f5d75" font-size="10">这部分才是让模型做对选择的内容</text>
    </g>

    <path d="M 520 134 H 580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#td-ar)"/>

    <g>
      <rect x="580" y="56" width="380" height="160" fill="#fff" stroke="rgba(45,49,66,.14)"/>
      <text x="598" y="80" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">TOTAL COST SCALES LINEARLY</text>
      <text x="598" y="108" fill="#2d3142" font-size="13" font-weight="600">十个 MCP 服务 · 每服务 20 个工具</text>
      <text x="598" y="132" fill="#4f5d75" font-size="10">200 个定义 × 平均 450 字节 ≈ 90 KB</text>
      <text x="598" y="154" fill="#4f5d75" font-size="10">占 200K 窗口约 11%</text>
      <text x="598" y="180" fill="#7a8399" font-size="9">这还没算系统提示、Skill 目录、历史消息</text>
      <text x="598" y="200" fill="#7a8399" font-size="9">工具数翻倍，占用翻倍，没有上限</text>
    </g>

    <g>
      <rect x="40" y="240" width="920" height="76" fill="#ececec" stroke="rgba(45,49,66,.14)"/>
      <text x="58" y="264" fill="#7a8399" font-size="8" font-family="var(--mono)" letter-spacing=".1em">THE OTHER CURVE</text>
      <text x="58" y="288" fill="#2d3142" font-size="12" font-weight="600">误选率随工具数非线性上升</text>
      <text x="58" y="306" fill="#4f5d75" font-size="10">相似工具越多，模型越可能选错或漏选；定义增长是线性的，判断负担不是。</text>
    </g>

    <text x="40" y="336" fill="#7a8399" font-size="10">所以优化顺序是：先减少常驻定义数量，再考虑缩短描述。</text>
  </svg>
</body>
</html>
